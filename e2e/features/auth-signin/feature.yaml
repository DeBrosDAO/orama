# Wallet sign-in end to end: SIWE and SIWS challenges and verification with
# every refusal code, nonce single use, token lifetimes, refresh rotation and
# replay, logout and the revocation list's reach across gateways, the lobby,
# namespace-name rules, JWKS and forged tokens, and the CLI's session handling
# (storage, renewal semantics under injected faults, flock single flight).
# Cluster-wide switches and rate-limit floods live in auth-cluster-admin,
# which runs alone.
id: auth-signin
title: Wallet sign-in, sessions and the CLI's session handling
area: auth
subtasks: [2826]
stage: 3
destructive: false
requires:
  extra_nodes: 0
  probe: false
  chain: false
covers:
  cli:
    - orama auth
    - orama auth list
    - orama auth login
    - orama auth logout
    - orama auth status
    - orama auth switch
    - orama auth whoami
    - orama namespace session-policy
  routes:
    - /.well-known/jwks.json
    - /v1/auth/api-key
    - /v1/auth/challenge
    - /v1/auth/jwks
    - /v1/auth/logout
    - /v1/auth/refresh
    - /v1/auth/verify
    - /v1/auth/whoami
    - /v1/namespace/session-policy
    - /v1/namespaces
  claims:
    - "docs/AUTH.md#signing-in: the message goes back verbatim; a message naming another domain is refused (AUTH_DOMAIN_MISMATCH)"
    - "docs/AUTH.md#signing-in: the access token lasts 15 minutes, the refresh token 30 days"
    - "docs/AUTH.md#signing-in: the refresh token rotates on every use; presenting one twice is a replay, refused and recorded"
    - "docs/AUTH.md#signing-in: only a 401/403 on refresh ends the CLI session; 5xx, 429, 400 and an unreachable gateway keep it"
    - "docs/AUTH.md#signing-in: renewal is single-flight across CLI processes under the credentials.json.lock flock"
    - "docs/AUTH.md#the-lobby: a challenge with no namespace signs in to default; the lobby session reaches only POST /v1/namespaces"
    - "docs/AUTH.md#when-a-request-is-refused: AUTH_CHALLENGE_INVALID is identical for an unknown, used or expired nonce"
    - "docs/AUTH.md#when-a-request-is-refused: every 401 and 403 carries {error, code, hint}"
    - "docs/AUTH.md#which-machines-are-signed-in-as-you: logout with all ends every session of the wallet"
    - "docs/AUTH.md#revoking: logging out revokes the refresh token and the access token"
    - "docs/AUTH.md#revoking: a revocation takes effect on every gateway within the 10-second reload"
    - "docs/AUTH.md#which-key-signed-a-token: JWKS serves every live key with the namespace it is bound to; a namespace gateway's key is bound to its namespace"
    - "docs/AUTH.md#sign-in-policy: a wallet with no grant is refused a members namespace (NAMESPACE_NOT_OWNED); open sign-in admits it as a grantless end user with no API key (ROLE_HAS_NO_KEY on /v1/auth/api-key)"
    - "docs/AUTH.md#sign-in-policy: closing sign-in refuses a grantless wallet's refresh (SIGN_IN_CLOSED) and any new sign-in"
    - "docs/AUTH.md#sign-in-policy: orama namespace session-policy shows and sets the policy, a field left out keeps its value"
    - "docs/API_SURFACE.md#namespace-management: namespace names are validated and the platform's names are reserved"
    - "docs/SECURITY.md: removed auth endpoints (simple-key, register, phantom) are gone"
