# Capability WebSockets end to end: a TinyGo fixture (testdata/capfn) that
# declares ws_auth: capability is deployed with the CLI and mints, revokes and
# reports capabilities from a real device-bound session. The walk checks the
# mint's bounds, opening with the capability alone (400 with a credential
# too), identical 403s that tell a probe nothing, the 16-socket cap, 4403 on
# revoking the capability or its issuing device, 4401 after expiry plus the
# grace, and fn:name selectors on invoke. The per-address upgrade limit needs
# a flood and is in auth-capability-ws-chaos.
# Needs tinygo on the runner's PATH (otherwise not applicable, not covered).
id: auth-capability-ws
title: Capability WebSockets and function selectors
area: auth
subtasks: [2827]
stage: 3
destructive: false
requires:
  extra_nodes: 0
  probe: false
  chain: false
covers:
  claims:
    - "docs/AUTH.md#capability-websockets: a capability opens only the minting function's socket, alone; with a credential too it is refused (400)"
    - "docs/AUTH.md#capability-websockets: forged, misdirected, versioned and unknown-function capabilities get the same 403; a revoked one is told it was revoked"
    - "docs/AUTH.md#capability-websockets: minting needs a device-bound session; ttl 60s to 7 days; resource up to 256 bytes"
    - "docs/AUTH.md#capability-websockets: one capability holds at most 16 sockets on a gateway (429 beyond)"
    - "docs/AUTH.md#capability-websockets: revoking a capability or its issuing device closes its sockets within 10 seconds (4403)"
    - "docs/AUTH.md#capability-websockets: a socket whose capability expired closes two minutes later (4401)"
    - "docs/SERVERLESS.md#capabilities: get_caller_capability reports what the socket was opened with"
    - "docs/AUTH.md#narrowing-a-grant: fn:name selectors narrow function invocation"
