# Rolling upgrades, driven by the CLI under test: the plan puts the raft
# leader last and needs --yes; a node whose upgrade fails stops the rollout
# with the rest untouched and the leadership where it was, and the same
# command resumes once it is fixed; an unknown node is refused. On a fleet
# installed from the previous release: a mixed-release window, then the
# rolling upgrade to HEAD under live namespace traffic, with identities and
# data preserved and the old CLI still reading the new cluster.
id: rollout-upgrade
title: Rolling upgrade, halt and resume, N-1 to N
area: infrastructure
subtasks: [2843, 2860, 2861]
stage: 10
destructive: true
requires:
  extra_nodes: 0
  probe: false
  chain: false
covers:
  cli:
    - orama node upgrade
    - orama node push
  claims:
    - "docs/CLI_REFERENCE.md#orama-node-upgrade: without --yes the plan is printed and nothing is restarted"
    - "docs/DEV_DEPLOY.md: a rolling upgrade restarts followers first and the raft leader last"
    - "docs/DEV_DEPLOY.md: a node that fails its upgrade stops the rollout; the remaining nodes are untouched"
    - "docs/ARCHITECTURE.md: orama node upgrade does not restart the index stack again once its health gate has seen the node serving"
    - "docs/SECURITY.md#rollout-strategy: followers first, leader last; a mixed-release cluster keeps working"
