# Post-install audit of every core node, the way an auditor with a root shell
# reads it: kernel and RAM hygiene, file ownership and modes of every secret,
# binary and trust anchor, the unit layout, the firewall, and the local node
# commands, and the refusals that cannot install anything even should they
# regress (the runner-side push usage, a non-root install or stage). The
# install and push refusals that would install on a live node if they
# regressed run in install-extra, against the disposable joined extra.
id: install
title: Post-install audit and archive trust on live nodes
area: infrastructure
subtasks: [2820]
stage: 9
destructive: false
requires:
  extra_nodes: 0
  probe: false
  chain: false
covers:
  cli:
    - orama push
    - orama node stage-archive
    - orama node install
    - orama node status
    - orama node doctor
    - orama node report
  units:
    - orama-namespace-coredns@.service
    - orama-namespace-wireguard@.service
  claims:
    - "docs/whitepaper/technical-reference/vol1/30-install-and-upgrade.md#the-firewall-swap-and-ram-hygiene-phase-6b: IPv6 is disabled at runtime and on every boot"
    - "docs/whitepaper/technical-reference/vol1/05-privilege-and-filesystem-trust.md#hardening-keeping-secrets-off-the-block-device: swap off, swap.target masked, fs.suid_dumpable=0, coredump Storage=none, secret units MemorySwapMax=0"
    - "docs/whitepaper/technical-reference/vol1/05-privilege-and-filesystem-trust.md#hardening-keeping-secrets-off-the-block-device: the node report reads core dumps, swap, ptrace and apport back at runtime and shows no drift on a healthy node (a drift raises the RAM hardening drifted warning)"
    - "docs/whitepaper/technical-reference/vol1/05-privilege-and-filesystem-trust.md#executing-a-request: wg0.conf is 0600"
    - "docs/whitepaper/technical-reference/vol1/05-privilege-and-filesystem-trust.md#per-service-accounts: /opt/orama/bin is root:orama 0750 and the orama user cannot replace a binary"
    - "docs/whitepaper/technical-reference/vol1/05-privilege-and-filesystem-trust.md#per-service-accounts: orama-node and the index daemons run as orama; CoreDNS as orama-coredns"
    - "docs/whitepaper/technical-reference/vol1/18-cache.md#supply-chain: /etc/orama/archive-signers is root:root 0644 and trusts exactly the operator wallet"
    - "docs/whitepaper/technical-reference/vol1/18-cache.md#supply-chain: --release-metadata without an adopted release root refuses the archive, never falling back to the wallet check"
    - "docs/whitepaper/technical-reference/vol1/05-privilege-and-filesystem-trust.md#the-helper-socket-and-its-service-instances: orama-privhelper.socket is root:orama 0660"
    - "docs/whitepaper/technical-reference/vol1/30-install-and-upgrade.md#the-firewall-swap-and-ram-hygiene-phase-6b: every allow rule is tagged orama and nothing outside the desired set is open"
    - "docs/whitepaper/technical-reference/vol1/06-the-wireguard-mesh.md#genesis-and-the-interface-file: the overlay rule is in on wg0 from 10.0.0.0/24"
    - "website/src/docs/contributor/architecture-reference.mdx: install enables only orama-node.service; every daemon is an orama-namespace-*@index instance"
