# IPFS storage as a customer and an operator see it: upload (multipart and
# the SDK's JSON form, large, empty, unicode, malformed), download (every
# node, Range, invalid CIDs), pin/status/unpin (idempotent, immediate
# reclaim, shared content), who may call it (no credential, a bare key, an
# exchanged key token, roles, another namespace), name normalisation, and on
# the nodes: ORMAW1 sealing in Kubo, the Kubo bearer, the cluster REST basic
# auth, the orama-only Kubo proxy, loopback binds, the GC timer, StorageMax
# and the monitor's IPFS collector.
id: storage
title: IPFS storage
area: storage
subtasks: [2836]
stage: 4
destructive: false
requires:
  extra_nodes: 0
  probe: false
  chain: false
covers:
  routes:
    - /v1/storage/upload
    - /v1/storage/get/
    - /v1/storage/pin
    - /v1/storage/status/
    - /v1/storage/unpin/
    - /v1/internal/storage/evict
    - /v1/internal/secrets/reencrypt
  units:
    - orama-namespace-ipfs@.service
    - orama-namespace-ipfs-cluster@.service
    - orama-namespace-ipfs-gc@.service
    - orama-namespace-ipfs-gc@.timer
  config:
    - "ipfs/repo/config.json:Datastore.StorageMax"
    - "service.json:api.restapi.basic_auth_credentials"
  claims:
    - "docs/AUTH.md: storage routes need a logged-in user; a bare key is 401 USER_JWT_REQUIRED; an exchanged key token may only unpin (bugboard #151)"
    - "docs/SECURITY.md#tenant-isolation: a namespace reads, pins and unpins only CIDs it owns"
    - "docs/SECURITY.md: private blobs are AES-256-GCM sealed (ORMAW1) before Add; tarballs are not"
    - "docs/SECURITY.md#network-isolation: Kubo requires its bearer; IPFS Cluster REST requires basic auth; service.json is 0600; all bind loopback"
    - "docs/ARCHITECTURE.md#node-process-model: serve-ipfs-cluster admits only sockets owned by the orama user"
    - "docs/MONITORING.md#ipfs: Datastore.StorageMax is 50% of the disk, floored at 10GB"
    - "docs/MONITORING.md#ipfs: the collector reads Kubo, the cluster and the pin-lock list with their credentials"
    - "docs/API_SURFACE.md#storage: unpin is idempotent; immediate=true reclaims everywhere; shared content is kept"
    - "docs/API_SURFACE.md#internal: /v1/internal/storage/evict is node-to-node only and never reachable by a client or by an unprivileged local process"
    - "docs/SECURITY.md#response-caching: /v1/storage/get answers Cache-Control: no-store so a download is not kept in a client disk cache"
