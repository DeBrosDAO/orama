# Lifecycle operations interrupted by failure, and load no client should
# produce: a namespace gateway killed while an app is being deployed, a
# node supervisor killed while a namespace is being provisioned and while
# the node is being upgraded, two nodes joining at once while an app
# deploys, and a thundering herd of wallet sign-in challenges from one
# address. The invariants: nothing hangs, nothing is left half-done (the
# operation either completed or fails with an error and can be redone), the
# gateway degrades to 429 with Retry-After and never to 5xx, and the cluster
# converges after every event. Needs two extra servers for the joins.
id: chaos-lifecycle
title: Chaos - interrupted deploys, provisioning, upgrades and joins; auth herd
area: infrastructure
subtasks: [2853]
stage: 11
destructive: true
requires:
  extra_nodes: 2
  probe: false
  chain: false
covers:
  cli:
    - orama deploy go
    - orama deploy static
    - orama node upgrade
    - orama node setup
    - orama node remove
  routes:
    - /v1/namespaces
    - /v1/namespace/status
    - /v1/namespace/delete
    - /v1/auth/challenge
    - /v1/deployments/go/upload
  claims:
    - "docs/whitepaper/technical-reference/appendices/d-cli-reference.md#orama-node-upgrade: an interrupted upgrade can be run again to completion"
    - "docs/whitepaper/technical-reference/vol1/27-rate-limits-and-egress-controls.md: the credential routes are rate limited per client address; the limit answers 429 with Retry-After"
    - "website/src/docs/operator/node-management.mdx: nodes join with their own invites and the cluster converges with every member"
