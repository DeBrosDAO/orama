# Vulnerabilities govulncheck reports as reachable and that the project accepts
# for now. TestGovulncheck_modulesUnaffected fails on a finding not listed here,
# on an entry that no longer appears (remove it), and on an entry past its
# review_by. review_by is at most 90 days away. See e2e/README.md, "Scanners".
accepted:
  - module: chain
    id: GO-2026-5932
    reason: >-
      golang.org/x/crypto/openpgp is unmaintained and has no fixed version. The
      chain never calls it: the reported traces are package init (cosmos-sdk
      crypto/armor imports openpgp/armor for key export and import) and
      interface dispatch (io.ReadAll and io.ReadFull in provider.Cat and
      storagekey.Apply treat armor.Read as a possible io.Reader; no code in the
      chain builds an armor reader). Real armor use is the operator key
      import/export commands of the cosmos keyring, reading a file the operator
      names on their own machine; no network peer or transaction supplies input
      to it.
    review_by: 2026-12-29
  - module: core/thirdparty/ipfs-cluster
    id: GO-2024-3218
    reason: >-
      github.com/libp2p/go-libp2p-kad-dht has no fixed version: the database
      lists every release as affected (the paper behind it, arXiv 2307.12212,
      is a protocol-level eclipse and censorship attack on a public Kademlia
      DHT, in which an attacker places Sybil peers near a key to hide its
      provider records). The advisory names no function, so govulncheck
      reports the whole package as reached: ipfs-cluster-service builds a
      dual DHT in clusterhost.go (newDHT) and refreshes and closes it. The
      attack needs attacker-controlled peers inside that DHT, and there are
      none to be had: the cluster host is created with
      libp2p.PrivateNetwork(cfg.Secret) (clusterhost.go baseOpts), the
      CLUSTER_SECRET every Orama node's installer generates and refuses to
      leave empty (core/pkg/install/installers/ipfs_cluster.go), so only the
      namespace's own cluster peers can complete a connection to join the
      routing table. The cluster uses the DHT to find its own peers, never to
      resolve content: pins are placed by the cluster's CRDT, and content is
      fetched by Kubo, not by this DHT. The module is otherwise current
      (v0.39.2) and the other four advisories of this binary are fixed by
      upgrade (pion/dtls v3.1.4, quic-go v0.60.0, webtransport-go v0.11.1).
      Revisit when go-libp2p-kad-dht publishes a release outside the
      advisory's range, or when the cluster host stops using a private
      swarm key.
    review_by: 2026-12-29
