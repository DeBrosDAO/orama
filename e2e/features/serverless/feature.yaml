# Serverless functions end to end with TinyGo fixtures (testdata/svcfn, and
# testdata/badimport for an unknown host module) deployed by the operator's
# CLI: init/build/deploy/list/get/invoke/logs/versions/disable/enable/delete,
# secrets and triggers; invocation access (private, public, keys, name@N,
# /v1/invoke, another namespace, the main gateway), limits (timeout -> 429,
# memory, per-namespace concurrency, server-side range), nested invoke, the
# caller context and device id, host functions (http_fetch SSRF matrix,
# cache atomics and TTL, the SQL guard, batch limits and transactions,
# ephemeral state limits, TTL and disconnect), the socket registry, cron
# fired once per slot across gateways, and the pubsub depth limit.
# Needs tinygo on the runner's PATH (otherwise not applicable, not covered).
# anon_fetch with Tor down is in anon-tor-chaos.
id: serverless
title: Serverless functions
area: serverless
subtasks: [2837]
stage: 5
destructive: false
requires:
  extra_nodes: 0
  probe: false
  chain: false
covers:
  cli:
    - orama function
    - orama function build
    - orama function delete
    - orama function deploy
    - orama function disable
    - orama function enable
    - orama function get
    - orama function init
    - orama function invoke
    - orama function list
    - orama function logs
    - orama function secrets
    - orama function secrets delete
    - orama function secrets list
    - orama function secrets set
    - orama function triggers
    - orama function triggers add
    - orama function triggers delete
    - orama function triggers list
    - orama function versions
  routes:
    - /v1/functions
    - /v1/functions/
    - /v1/invoke/
    - /v1/serverless/ws/connections
    - /v1/serverless/ws/connections/
  claims:
    - "docs/SERVERLESS.md#functionyaml: memory 1-256 MB, timeout 1-300 s; a direct invoke past its timeout is 429 RATE_LIMITED"
    - "docs/SERVERLESS.md#functionyaml: a private function needs a signed-in wallet or the invoke grant; a storage-only key is refused"
    - "docs/SERVERLESS.md#versioning: name@N invokes version N"
    - "docs/SERVERLESS.md#http-api-reference: management acts on the credential's namespace; another namespace is refused"
    - "docs/SERVERLESS.md#host-functions-api: an import from a module other than env, host or orama fails to instantiate"
    - "docs/SECURITY.md#tenant-isolation: http_fetch refuses loopback, RFC 1918, link-local, CGNAT and wrapped IPv4, by name and by redirect"
    - "docs/SERVERLESS.md#database-rqlite: ATTACH, PRAGMA, VACUUM, CREATE TRIGGER, two statements and reserved tables in every quoting are refused"
    - "docs/SERVERLESS.md#database-transactions: 100 statements per batch (TOO_MANY_STATEMENTS at 101), 10,000 rows per query op, rollback on a failed op"
    - "docs/SERVERLESS.md#cache-olric-distributed-cache: cache_incr is atomic (concurrent calls return 1..n once each, a refused call is reported as one); ttl 0 never expires, negative is refused; cache_delete of a missing key is 1"
    - "docs/SERVERLESS.md#ephemeral-state-ws-subscribe-tracked: 16 KiB payload, 256 keys per client, TTL backstop, cleared on disconnect"
    - "docs/SERVERLESS.md#managing-secrets: values are never listed; get_secret decrypts"
    - "docs/SERVERLESS.md#depth-limiting: pubsub trigger chains stop at depth 5"
    - "docs/CLI_REFERENCE.md#orama-function-triggers: cron triggers fire once per scheduled run across the namespace's gateways"
    - "docs/SERVERLESS.md#context: get_caller_device_id is the session's device thumbprint"
    - "docs/SECURITY.md#tenant-isolation: WASM concurrency has a per-namespace slot"
