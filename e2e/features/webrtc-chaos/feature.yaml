# WebRTC under failure: an SFU stopped mid-call tells its peers
# server-draining and a reconnect through another node carries media again;
# a node partitioned past the viability grace loses its TURN role to live
# nodes (DNS and relays follow), and the cluster converges after it heals.
id: webrtc-chaos
title: WebRTC with an SFU down and a node partitioned
area: webrtc
subtasks: [2838]
stage: 11
destructive: true
requires:
  extra_nodes: 0
  probe: false
  chain: false
covers:
  claims:
    - "docs/WEBRTC.md#3-connect-signaling-websocket: server-draining tells clients to reconnect to another node"
    - "docs/WEBRTC.md#room-placement: a room whose SFU is down is placed on a healthy SFU, and all peers reconnecting through different gateways meet there"
    - "docs/WEBRTC.md#role-reconciliation: roles of a node non-viable past the grace move to live members; DNS advertises only nodes serving TURN"
