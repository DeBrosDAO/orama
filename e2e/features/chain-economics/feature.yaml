    - "docs/whitepaper/technical-reference/vol2/44-governance-and-contracts.md#governance-and-contracts: REFUSAL PATHS ONLY: orama.houses.v1.MsgLockHouseBond; the success path needs a funded bank balance (trigger: a funding path exists)"
    - "docs/whitepaper/technical-reference/vol2/44-governance-and-contracts.md#proposals: REFUSAL PATHS ONLY: orama.houses.v1.MsgUnlockHouseBond; the success path needs a funded bank balance (trigger: a funding path exists)"
