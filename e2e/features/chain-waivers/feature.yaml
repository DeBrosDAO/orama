# Stage 8, E2E-37: tripwires for the chain code that is built but not wired
# into oramad (x/vpnlaunch, x/confidential, x/wasmbindings). They assert the documented absence on the live chain: no
# message registered, no query answered, no genesis state, no user-to-user
# payment; that x/inclusion's vote extensions are on exactly from the height the
# deploy's genesis names; and that the orama messages the node
# registers are exactly those chain/proto declares. A surface that ships
# turns its test red, which forces real tests and the removal of its waiver.
id: chain-waivers
title: Unwired chain modules stay unwired (tripwires)
area: chain
subtasks: [2856]
stage: 8
destructive: false
requires:
  extra_nodes: 0
  probe: false
  chain: true
covers:
  claims:
    - "docs/CHAIN.md#inclusion-lists-c13: vote extensions are on from the genesis height the deploy sets (0 = off on a run chain, 2 on stagenet) and nothing changes it"
    - "docs/CHAIN.md#denom-and-accounts: a user cannot pay another user in the public denom; the private path is x/shielded (chain-shielded)"
    - "docs/CHAIN.md#other-fail-closed-pieces: x/confidential accepts no attestation; nothing on chain reaches it"
    - "docs/CHAIN.md#modules-wired: the node registers exactly the orama messages chain/proto declares"
