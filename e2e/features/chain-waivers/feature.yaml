# Stage 8, E2E-37: tripwires for the chain code that is built but not wired
# into oramad (x/shielded, x/inclusion, x/vpnlaunch, x/confidential,
# x/wasmbindings). They assert the documented absence on the live chain: no
# message registered, no query answered, no genesis state, vote extensions
# off, no user-to-user payment; and that the orama messages the node
# registers are exactly those chain/proto declares. A surface that ships
# turns its test red, which forces real tests and the removal of its waiver.
id: chain-waivers
title: Unwired chain modules stay unwired (tripwires)
area: chain
subtasks: [2856]
stage: 8
destructive: false
requires:
  extra_nodes: 0
  probe: false
  chain: true
covers:
  claims:
    - "docs/CHAIN.md#modules-wired: x/inclusion bytes are never put in a block (no vote extensions)"
    - "docs/CHAIN.md#denom-and-accounts: there is no shielded payment path; a user cannot pay another user"
    - "docs/CHAIN.md#other-fail-closed-pieces: x/confidential accepts no attestation; nothing on chain reaches it"
    - "docs/CHAIN.md#modules-wired: the node registers exactly the orama messages chain/proto declares"
