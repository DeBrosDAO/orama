# The Orama Tor network (Open Network track E, bugboard 2783-2787): the authority
# key ceremony, the txgate behind the validator onion service, and (where the
# roles are installed) directory authorities, relays, the opt-in exit and the
# validator onion service, checked end to end through a throwaway client of the
# network.
#
# The ceremony and txgate tests run on any target: they use the node's own tor
# and tor-gencert, and a loopback listener. The role tests need
# `orama global install --services dirauth|relay|relay,exit|onion` on the nodes
# (docs/TOR_NETWORK.md, "Rolling it out") and say "not applicable" on a target
# that has none: the provisioned fleet installs no Tor role, stagenet does.
id: tor-network
title: Orama Tor network - ceremony, authorities, relays, exit, validator onion
area: network
subtasks: [2783, 2784, 2785, 2786, 2787]
stage: 8
destructive: false
requires:
  extra_nodes: 0
  probe: false
  chain: false
covers:
  cli:
    - orama global tor
    - orama global tor ceremony
    - orama global tor archive
    - orama global tor info
    - orama global tor onions
    - orama global tor onions add
    - orama global tor monitor
    - orama global txgate
    - orama global install
  claims:
    - "docs/TOR_NETWORK.md#key-ceremony: the ceremony writes the identity key only under offline/ and the deploy bundle holds no identity key"
    - "docs/TOR_NETWORK.md#the-network-file: the ceremony writes the one network file (private true, no validator onions) and orama global tor onions add puts a validator onion into it, refusing a clearnet host"
    - "docs/TOR_NETWORK.md#the-validator-onion-service: the onion service serves the account read, the broadcast and the transaction lookup, and no other path of the chain REST API"
    - "docs/TOR_NETWORK.md#directory-authorities: the authorities sign a consensus that lists every relay, and the archive's manifest matches the files"
    - "docs/TOR_NETWORK.md#exits: an exit refuses reserved ranges and mail ports; a relay that was not installed as an exit has no Exit flag"
    - "docs/TOR_NETWORK.md#relays: the ORPort is reachable from outside and the tx gate is not"
    - "docs/TOR_NETWORK.md#relays: a relay and a directory authority each write monitor.json in their own home (in_consensus), which the node report reads"
