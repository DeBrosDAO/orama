# Stage 8, E2E-32 + E2E-39: the operator CLI's chain commands and the
# cluster/chain co-hosting. `orama global bind` signs the documented binding
# statement (verified here for ed25519 and secp256k1); every chain command
# without --node prints only a SIGN_MODE_DIRECT sign document (chain id,
# account, sequence, fee, gas, one message of the documented type) and the
# documents are transactions the chain executes (signed by the operator's own
# key on its node: the headless RootWallet agent refuses orama-tx until
# RootWallet task 2857; with --node the tests expect ORAMA_TX_REFUSED, or,
# with E2E_ORAMA_TX_SIGNING=1, a signature from the agent's own key);
# `orama storage seal|open|rewrap` round trip locally and put/get check the
# chain first. Co-hosting: the chain unit runs confined as orama-chain and
# cannot see /etc/orama or /etc/wireguard, p2p only on the WireGuard address,
# RPC/gRPC/REST/Prometheus only on loopback, no chain port open publicly, the
# monitor's chain section, and the deploy script's read-only status and
# invariants.
id: chain-global
title: Chain CLI documents, RootWallet signing gap, co-hosting
area: chain
subtasks: [2851, 2859]
stage: 8
destructive: false
requires:
  extra_nodes: 0
  probe: false
  chain: true
covers:
  cli:
    - orama global
    - orama global bind
    - orama global bond
    - orama global unbond
    - orama global capacity
    - orama global register
    - orama global retire
    - orama cluster register-onchain
    - orama cluster retire-onchain
    - orama storage
    - orama storage accept
    - orama storage create
    - orama storage decline
    - orama storage extend
    - orama storage get
    - orama storage grant
    - orama storage open
    - orama storage prove
    - orama storage put
    - orama storage revoke
    - orama storage rewrap
    - orama storage seal
    - orama monitor chain
  queries:
    - orama.nodes.v1.Cluster
    - orama.nodes.v1.Node
    - orama.storage.v1.Authorization
  claims:
    - "docs/CLI_REFERENCE.md#orama-global-bind: the binding signs orama-global-bind-v1|chain-id|operator|service|hex(pubkey)"
    - "docs/CLI_REFERENCE.md: without --node every chain command prints the sign document and submits nothing"
    - "docs/CHAIN.md#x-nodes: the CLI-built sign documents are transactions the chain executes"
    - "plans/e2e-fleet.md: the headless RootWallet agent refuses wallet:sign:orama-tx (ORAMA_TX_REFUSED) until RootWallet task 2857"
    - "docs/CHAIN.md#client-side: seal writes one ciphertext per slot; open and rewrap with the right seeds only; seed files must be 0600"
    - "docs/CHAIN.md#running-a-localnet: chain p2p on the overlay, RPC/gRPC/REST/Prometheus on loopback only"
    - "docs/CHAIN.md#the-stagenet-deploy-script: the chain unit runs as orama-chain and cannot see /etc/orama or /etc/wireguard"
