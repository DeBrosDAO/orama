# The vault as a client and an operator see it: the gateway's push/pull with
# the Ed25519 ownership proof (the messages sdk-vault signs), the Shamir split
# over three guardians (K=2, W=3), monotonic versions, the share size limit,
# wrong owners and stale proofs, malformed input, the per-identity limits and
# X-Forwarded-For, and on the nodes: the guardian unit, overlay-only binding,
# a direct push without a session, and what vault/docs/API.md says is not
# built yet. A guardian down is vault-chaos.
id: vault
title: Vault (Shamir secret storage)
area: vault
subtasks: [2841]
stage: 4
destructive: false
requires:
  extra_nodes: 0
  probe: false
  chain: false
covers:
  routes:
    - /v1/vault/health
    - /v1/vault/status
    - /v1/vault/push
    - /v1/vault/pull
  units:
    - orama-namespace-vault@.service
  claims:
    - "vault/docs/API.md: ownership proof vault-push-v1:<identity>:<version> / vault-pull-v1:<identity>:<ts> within 120s; identity = sha256(pubkey)"
    - "vault/docs/API.md: versions are strictly increasing (409 on equal or lower)"
    - "vault/docs/API.md: a share is at most 512 KiB; push body 1 MiB, pull body 4 KiB"
    - "vault/docs/SECURITY_MODEL.md#threshold-and-share-count: K = max(2, n/3) and W = min(n, max(K+1, ceil(2n/3)))"
    - "vault/docs/API.md: guardian health is degraded and the guardian list empty until peer discovery exists; nothing listens on 7501"
    - "vault/docs/API.md#base-url: guardians are overlay-only"
