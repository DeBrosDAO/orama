# Stage 8: x/shielded on the live run chain (docs/CHAIN.md "x/shielded: the
# Ironwood shielded pool"). The run's oramad is built with CGO_ENABLED=0 and
# no verifier binary (e2e/scripts/chain-deploy.sh), and the run chain holds no
# bank balance, so no bundle can be accepted: the tests drive every message
# with structurally canonical bundles (zeros for the proof, random notes) and
# assert each refusal the chain gives before, and instead of, a proof check:
# framing, value-balance sign, unshield target, fee floor, duplicate
# nullifier, transaction shape (signed shielded message alone in its tx,
# signer-less transfer with the protocol signer, no memo, no fee), and the
# refusal of a well-formed bundle at the anchor gate (Admit checks the anchor
# before any verifier; the run's build cannot even hash the tree). The
# verifiers are not reached. After each
# step the pool, the note tree and the nullifier set are unchanged and every
# module's Invariants query holds on every validator. The queries Params,
# Pools, TreeState, NullifierSpent and Invariants are read through abci_query.
# Shielding is optional: a public bank send and MsgWithdrawEarnings need no pool
# (features/chain-core, chain-transfers), and the CLI and SDK are private unless
# told --public / public: true. The success paths (a wallet-built scenario:
# shield, shield from earnings, transfer, unshield, as chain/scripts/stagenet
# gen-shielded builds it) need a run chain built with the Orchard library and the pinned verifier binary;
# they are reported as refusal-only claims until chain-deploy.sh builds and
# installs them.
id: chain-shielded
title: Shielded pool refusals, the anchor gate and queries
area: chain
subtasks: []
stage: 8
destructive: false
requires:
  extra_nodes: 0
  probe: false
  chain: true
covers:
  msgs:
    - orama.shielded.v1.MsgShield
    - orama.shielded.v1.MsgShieldEarnings
    - orama.shielded.v1.MsgShieldedTransfer
    - orama.shielded.v1.MsgUnshield
  queries:
    - orama.shielded.v1.Params
    - orama.shielded.v1.Pools
    - orama.shielded.v1.TreeState
    - orama.shielded.v1.NullifierSpent
    - orama.shielded.v1.Invariants
  claims:
    - "docs/CHAIN.md#x-shielded: a bundle needs the right value-balance sign for its message, a canonical framing and at most max_actions_per_bundle actions"
    - "docs/CHAIN.md#x-shielded: a shielded message is the only message in its tx; a signer-less transfer carries no signature, no fee and no memo and names the protocol signer"
    - "docs/CHAIN.md#x-shielded: an unshield goes only to a target its signer owns; deposit and contract targets are not linked"
    - "docs/CHAIN.md#x-shielded: a transfer's value balance is its fee and covers the base fee of its gas and the nullifier fee of every action"
    - "docs/CHAIN.md#x-shielded: a bundle whose anchor is not one of the tree's is refused before any proof is checked, and a node that cannot hash the tree accepts none; the pool, the tree and the nullifier set stay untouched"
    - "docs/SECURITY_PLAYBOOKS.md: the module account equals the pools plus the queue, no pool is negative, the nullifier database folds to the accumulator"
    - "docs/CHAIN.md#x-shielded: REFUSAL PATHS ONLY: orama.shielded.v1.MsgShield; the success path needs a run chain built with the Orchard library and the pinned verifier binary (trigger: chain-deploy.sh builds and installs them)"
    - "docs/CHAIN.md#x-shielded: REFUSAL PATHS ONLY: orama.shielded.v1.MsgShieldEarnings; the success path needs a run chain built with the Orchard library and the pinned verifier binary (trigger: chain-deploy.sh builds and installs them)"
    - "docs/CHAIN.md#x-shielded: REFUSAL PATHS ONLY: orama.shielded.v1.MsgShieldedTransfer; the success path needs a run chain built with the Orchard library and the pinned verifier binary (trigger: chain-deploy.sh builds and installs them)"
    - "docs/CHAIN.md#x-shielded: REFUSAL PATHS ONLY: orama.shielded.v1.MsgUnshield; the success path needs a run chain built with the Orchard library and the pinned verifier binary (trigger: chain-deploy.sh builds and installs them)"
