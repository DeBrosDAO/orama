# Stage 8, track E5 of the Open Network plan: the relay bandwidth reporter
# (`orama-global reporter`, docs/TOR_NETWORK.md#the-relay-bandwidth-reporter).
# It runs on a directory-authority host, and a run chain has none: the fleet
# has no dirauth, no votes and no relays. The tests therefore need what the
# run may not have, and report not applicable without it: an orama-global
# binary on the chain node (the stagenet install has one), a node that
# `orama global install --services chain,dirauth,reporter` set up (its home,
# operator and authority-id need no manual step), and for the report itself a
# hot key that is in x/relay's reporter set and funded (the reporter creates
# the key on its first start) and archived votes in the home's votes directory.
# What they prove on a live chain: the reporter will not start without its
# identity, the install prepared the home from the network file, and a closed
# epoch's report is accepted by x/relay (the reporter's state records it as
# reported).
id: relay-reporter
title: Relay bandwidth reporter (x/relay MsgReportEpoch from a dirauth's votes)
area: chain
subtasks: [2788]
stage: 8
destructive: false
requires:
  extra_nodes: 0
  probe: false
  chain: true
covers:
  claims:
    - "docs/TOR_NETWORK.md#the-relay-bandwidth-reporter: the reporter refuses to start without its operator and authority identity"
    - "docs/TOR_NETWORK.md#the-relay-bandwidth-reporter: a closed epoch is reported once, in chunks, during the epoch after it (x/relay's report window), and x/relay takes the report (needs archived votes and a reporter key in x/relay's set)"
    - "docs/TOR_NETWORK.md#the-relay-bandwidth-reporter: orama global install prepares the reporter's home: its account owns it, the operator is an account address and the authority-id is the v3_ident of an authority in the installed network file"
