# The TUF release root on a node, with real signed metadata generated per run
# by core's own generator: `orama node stage-archive --release-metadata
# --release-target` on a fresh extra server stages a valid archive, then
# refuses a rolled-back snapshot, a frozen (expired) timestamp, a role below
# its signature threshold, a target whose hash or length differs and a
# target name the metadata does not list — each with the refusal naming the
# failed check and nothing under /opt/orama changed; with no root adopted it
# refuses instead of falling back to the wallet check. `orama global
# stage-oramad` stages a verified oramad and refuses the same failures,
# staging nothing.
id: release-tuf
title: TUF release root refusals for stage-archive and stage-oramad
area: infrastructure
subtasks: []
stage: 10
destructive: false
requires:
  extra_nodes: 1
  probe: false
  chain: false
covers:
  cli:
    - orama node stage-archive
    - orama global stage-oramad
  claims:
    - "docs/whitepaper/technical-reference/appendices/d-cli-reference.md#orama-node-stage-archive: before anything is extracted the archive must be the target in TUF metadata signed under the adopted root; any failure refuses it and the wallet check is not tried instead"
    - "docs/whitepaper/technical-reference/appendices/d-cli-reference.md#orama-node-stage-archive: a snapshot older than the one recorded in /etc/orama/release-seen.json is refused"
    - "docs/whitepaper/technical-reference/appendices/d-cli-reference.md#orama-global-stage-oramad: a binary is placed only after it verifies against the release root through TUF metadata"
    - "docs/whitepaper/technical-reference/vol1/18-cache.md#supply-chain: a TUF refusal leaves /opt/orama unchanged and does not raise the rollback record"
