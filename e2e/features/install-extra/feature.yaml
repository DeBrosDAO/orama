# One fresh server through its whole life: setup refuses a wrong or
# unconfirmed host key before any credential touches it, joins it as a
# full member of every membership view; on the joined node (disposable, so
# a refusal that regresses into an install never lands on a core node) the
# install flag refusals, the dry run and the archive-trust refusals change
# nothing; a second setup changes nothing,
# remove prints its plan, declines without a confirmation, then retires the
# node cluster-wide and wipes it (the operator's own firewall rule survives),
# and a removed node is no longer a target for remove, wipe or clean.
id: install-extra
title: Fresh server setup, join, re-run, remove and wipe
area: infrastructure
subtasks: [2820]
stage: 9
destructive: true
requires:
  extra_nodes: 1
  probe: false
  chain: false
covers:
  cli:
    - orama node setup
    - orama node remove
    - orama node wipe
    - orama node clean
    - orama nodes
    - orama node install
    - orama node push
  claims:
    - "docs/CLI_REFERENCE.md#orama-node-install: --dry-run shows what would be done without making changes"
    - "docs/CLI_REFERENCE.md#orama-node-install: a genesis install needs --operator-wallet; flag mistakes are refused before anything changes"
    - "docs/SECURITY.md#supply-chain: an unsigned, untrusted-signer, tampered or extra-file archive is refused and nothing under /opt/orama changes"
    - "docs/SECURITY.md#supply-chain: --trust-signers never changes an existing anchor"
    - "docs/CLI_REFERENCE.md#orama-node-setup: a --host-key that does not match is refused before the credential is used"
    - "docs/CLI_REFERENCE.md#orama-node-setup: a node already running this exact build is not re-uploaded"
    - "docs/CLI_REFERENCE.md#orama-node-remove: --dry-run prints the quorum impact and the statements and changes nothing"
    - "docs/CLI_REFERENCE.md#orama-node-remove: the node leaves raft and the mesh, is tombstoned and wiped"
    - "docs/CLI_REFERENCE.md#orama-node-wipe: only rules tagged orama are removed; the operator's own rules and SSH stay"
    - "docs/CLI_REFERENCE.md#orama-node-clean: clean is deprecated and runs wipe"
    - "docs/SECURITY.md#supply-chain: a joining node takes the archive signer list from the cluster"
