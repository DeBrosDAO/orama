[[allowlists]]
description = "Public constants and labels that only look like keys: a GPG fingerprint, an HKDF purpose string, a key type name, a doc sentence quoting an HKDF label, the scanner's own pattern for curl -u"
paths = [
  '''(^|/)core/pkg/install/installers/tor\.go$''',
  '''(^|/)core/pkg/serverless/hostfunctions/secrets\.go$''',
  '''(^|/)core/pkg/telemetry/report/chain_verify\.go$''',
  '''(^|/)docs/SECURITY\.md$''',
  '''(^|/)e2e/harness/secrets/patterns\.go$''',
]
