# nginx site for orama.network — installed at
# /etc/nginx/sites-available/orama.network on the web host and linked into
# sites-enabled. This is the plain-HTTP stage; `certbot --nginx` then adds the
# 443 server block and the HTTP -> HTTPS redirect to the installed copy.
#
# The site is prerendered static HTML (see website/scripts/prerender.mjs):
#   /platform  -> /platform/index.html   (served directly, no trailing-slash redirect)
#   /docs/...  -> /index.html            (client-rendered, unlisted docs)
#   anything else unknown -> 404 status, body rendered by the app's 404 page

server {
    listen 80;
    listen [::]:80;
    server_name orama.network www.orama.network;

    root /opt/orama-website;
    index index.html;

    # www is an alias: one canonical host for search engines.
    if ($host = www.orama.network) {
        return 301 $scheme://orama.network$request_uri;
    }

    gzip_vary on;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/xml image/svg+xml;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # Pages: always revalidate, so a deploy is visible immediately.
    location / {
        try_files $uri $uri/index.html =404;
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    }

    # The unlisted docs are rendered by the app from the home shell.
    location /docs {
        try_files $uri /index.html;
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    # Hashed build output never changes under the same name.
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    location /images/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=2592000" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    # Unknown paths: a real 404 status, with the app shell rendering its 404 page.
    error_page 404 /index.html;
}
