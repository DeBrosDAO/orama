# nginx site for orama.network — installed at
# /etc/nginx/sites-available/orama.network on the web host and linked into
# sites-enabled. This is the plain-HTTP stage; `certbot --nginx` then adds the
# 443 server block and the HTTP -> HTTPS redirect to the installed copy.
#
# The site is prerendered static HTML (see website/scripts/prerender.mjs):
#   /platform, /docs/..., /blog/... -> <path>/index.html (served directly, no trailing-slash redirect)
#   /explorer/<anything>            -> /explorer/index.html, kept out of search (live data)
#   anything else unknown           -> 404 status with /404.html (noindex)

server {
    listen 80;
    listen [::]:80;
    server_name orama.network www.orama.network;

    root /opt/orama-website;
    index index.html;

    # www is an alias: one canonical host for search engines.
    if ($host = www.orama.network) {
        return 301 $scheme://orama.network$request_uri;
    }

    gzip_vary on;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/xml application/rss+xml image/svg+xml;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # Pages: always revalidate, so a deploy is visible immediately.
    location / {
        try_files $uri $uri/index.html =404;
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    }

    # nginx drops the server-level add_header lines in any location that sets
    # its own, so each location below repeats the security headers.

    # Explorer pages (a block, a transaction, a wallet) are rendered by the
    # app from the explorer's shell. Live data: kept out of search engines.
    location = /explorer/ {
        return 301 /explorer;
    }

    location /explorer/ {
        try_files $uri $uri/index.html /explorer/index.html;
        add_header Cache-Control "no-cache" always;
        add_header X-Robots-Tag "noindex" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    }

    # Generated link-preview images keep their name when a title changes.
    location /og/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=86400" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    }

    location = /blog/rss.xml {
        default_type application/rss+xml;
        types { }
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    }

    # Hashed build output never changes under the same name.
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    location /images/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=2592000" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    # Unknown paths: a real 404 status, with the prerendered (noindex) 404 page.
    error_page 404 /404.html;
}
