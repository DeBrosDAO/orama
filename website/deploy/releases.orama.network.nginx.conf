# nginx site for releases.orama.network, the DeBros release repository. Installed
# like orama.network.nginx.conf: at /etc/nginx/sites-available/releases.orama.network,
# linked into sites-enabled, then `certbot --nginx` adds the 443 block.
#
# The host serves two things and stores no archive:
#
#   /timestamp.json /snapshot.json /targets.json /root.json /<N>.root.json
#       TUF metadata, static files that `orama maint release publish` rsyncs into
#       /opt/orama-releases. A client verifies every byte it reads, so the host
#       adds availability and nothing else.
#   /targets/<channel>/orama-<version>-linux-<arch>.tar.gz
#   /targets/dev/<branch>/orama-<version>-linux-<arch>.tar.gz
#       a 302 to the archive, a GitHub release asset of DeBrosDAO/orama. The tag
#       is `release-<channel>-<version>`; for dev/<branch> the "/" becomes "."
#       (releasepub.Channel.Tag). The client accepts an https redirect to a public
#       host (releaseverify checkRedirectTarget) and checks the bytes it gets
#       against the length and hashes in the signed targets.
#
# nginx drops server-level add_header lines in a location that sets its own, so
# each location repeats the headers it needs.
#
# Channel and branch segments are 1 to 32 of a-z, 0-9 and "-"; a version is
# digits and dots (a "+" in a version is refused where a release is cut).

server {
    listen 80;
    listen [::]:80;
    server_name releases.orama.network;

    root /opt/orama-releases;

    server_tokens off;
    autoindex off;

    # The one-segment channels: nightly, main.
    location ~ "^/targets/(?<channel>[a-z0-9-]{1,32})/(?<file>orama-(?<version>[0-9][0-9A-Za-z.-]*)-linux-(?:amd64|arm64)\.tar\.gz)$" {
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
        return 302 https://github.com/DeBrosDAO/orama/releases/download/release-$channel-$version/$file;
    }

    # dev/<branch>.
    location ~ "^/targets/(?<channel>[a-z0-9-]{1,32})/(?<branch>[a-z0-9-]{1,32})/(?<file>orama-(?<version>[0-9][0-9A-Za-z.-]*)-linux-(?:amd64|arm64)\.tar\.gz)$" {
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
        return 302 https://github.com/DeBrosDAO/orama/releases/download/release-$channel.$branch-$version/$file;
    }

    # Metadata: always revalidate. A stale timestamp is a freeze to a client, and
    # a stale snapshot hides a release. Only these names are served.
    location ~ "^/(?:timestamp|snapshot|targets|root|[0-9]+\.root)\.json$" {
        default_type application/json;
        types { }
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
        try_files $uri =404;
    }

    # Everything else is a 404, including pending-release.json should one ever
    # be synced by mistake.
    location / {
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
        return 404;
    }
}
