# Orama-authored test contract for the C9 app tests. It is not a genesis contract and is not
# shipped: it forwards whatever CosmosMsg or QueryRequest a test hands it, so a test can attempt
# every message a real contract could send (bank sends, custom bindings, Any, submessages).
#
# Build (the same toolchain as chain/contracts/standard/build.sh):
#   RUSTFLAGS='-C link-arg=-s' rustup run 1.81.0 cargo build --release --lib --locked \
#     --target wasm32-unknown-unknown
#   wasm-opt -Os --signext-lowering target/wasm32-unknown-unknown/release/orama_relay.wasm \
#     -o ../relay.wasm
[package]
name = "orama-relay"
version = "0.1.0"
edition = "2021"
rust-version = "1.81"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
cosmwasm-std = { version = "=2.2.2", features = ["staking", "cosmwasm_2_2"] }
schemars = "0.8"
serde = { version = "1", default-features = false, features = ["derive"] }
serde_json = { version = "1", default-features = false, features = ["alloc"] }

[profile.release]
opt-level = "s"
lto = true
panic = "abort"
codegen-units = 1
