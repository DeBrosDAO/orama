syntax = "proto3";
package orama.fees.v1;

option go_package = "github.com/DeBrosOfficial/network/chain/x/fees/types";

import "gogoproto/gogo.proto";
import "orama/fees/v1/fees.proto";

// Query defines the gRPC querier service for x/fees. There is no Msg
// service (see Params): fees are paid through the ante handler, earnings are
// credited by other modules' keepers, and deposits are locked/released by
// their owning module's keeper - never by a user-signed x/fees message.
service Query {
  rpc Params(QueryParamsRequest) returns (QueryParamsResponse);
  rpc BaseFee(QueryBaseFeeRequest) returns (QueryBaseFeeResponse);
  rpc Earnings(QueryEarningsRequest) returns (QueryEarningsResponse);
  rpc FeeBalance(QueryFeeBalanceRequest) returns (QueryFeeBalanceResponse);
  rpc Deposit(QueryDepositRequest) returns (QueryDepositResponse);
  rpc Invariants(QueryInvariantsRequest) returns (QueryInvariantsResponse);
}

message QueryParamsRequest {}

message QueryParamsResponse {
  Params params = 1 [(gogoproto.nullable) = false];
}

message QueryBaseFeeRequest {}

message QueryBaseFeeResponse {
  string base_fee = 1 [
    (gogoproto.customtype) = "cosmossdk.io/math.Int",
    (gogoproto.nullable) = false
  ];
}

message QueryEarningsRequest {
  string address = 1;
}

message QueryEarningsResponse {
  string balance = 1 [
    (gogoproto.customtype) = "cosmossdk.io/math.Int",
    (gogoproto.nullable) = false
  ];
}

message QueryFeeBalanceRequest {
  string address = 1;
}

message QueryFeeBalanceResponse {
  string balance = 1 [
    (gogoproto.customtype) = "cosmossdk.io/math.Int",
    (gogoproto.nullable) = false
  ];
}

message QueryDepositRequest {
  string id = 1;
}

message QueryDepositResponse {
  Deposit deposit = 1 [(gogoproto.nullable) = false];
}

message QueryInvariantsRequest {}

message QueryInvariantsResponse {
  bool earnings_match_module = 1;
  bool deposits_match_module = 2;
  bool fees_balance = 3;
  string detail = 4;
  string cumulative_collected = 5 [
    (gogoproto.customtype) = "cosmossdk.io/math.Int",
    (gogoproto.nullable) = false
  ];
  string cumulative_burned = 6 [
    (gogoproto.customtype) = "cosmossdk.io/math.Int",
    (gogoproto.nullable) = false
  ];
  string cumulative_distributed = 7 [
    (gogoproto.customtype) = "cosmossdk.io/math.Int",
    (gogoproto.nullable) = false
  ];
}
