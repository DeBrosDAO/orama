syntax = "proto3";
package orama.archive.v1;

option go_package = "github.com/DeBrosOfficial/network/chain/x/archive/types";

import "gogoproto/gogo.proto";
import "orama/archive/v1/archive.proto";

// Query defines the gRPC querier service for x/archive.
service Query {
  rpc Params(QueryParamsRequest) returns (QueryParamsResponse);
  rpc Range(QueryRangeRequest) returns (QueryRangeResponse);
  rpc LastArchivedHeight(QueryLastArchivedHeightRequest) returns (QueryLastArchivedHeightResponse);
  rpc RetainHeight(QueryRetainHeightRequest) returns (QueryRetainHeightResponse);
}

message QueryParamsRequest {}

message QueryParamsResponse {
  Params params = 1 [(gogoproto.nullable) = false];
}

message QueryRangeRequest {
  int64 start_height = 1;
  int64 end_height = 2;
}

message QueryRangeResponse {
  RangeRecord range = 1 [(gogoproto.nullable) = false];
}

message QueryLastArchivedHeightRequest {}

message QueryLastArchivedHeightResponse {
  int64 last_archived_height = 1;
}

message QueryRetainHeightRequest {}

message QueryRetainHeightResponse {
  int64 retain_height = 1;
  int64 tip = 2;
  int64 last_archived_height = 3;
  int64 retention_window_blocks = 4;
}
