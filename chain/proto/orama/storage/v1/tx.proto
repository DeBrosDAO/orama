syntax = "proto3";
package orama.storage.v1;

option go_package = "github.com/DeBrosOfficial/network/chain/x/storage/types";

import "amino/amino.proto";
import "cosmos/msg/v1/msg.proto";
import "gogoproto/gogo.proto";
import "orama/storage/v1/storage.proto";

// Msg is x/storage's transaction service. There is no cancel method: a deal
// cannot be cancelled (plans/open-network/track-c-chain.md C7). Protocol deals
// are not in this service; the module creates them itself.
service Msg {
  option (cosmos.msg.v1.service) = true;

  rpc CreateDeal(MsgCreateDeal) returns (MsgCreateDealResponse);
  rpc ExtendDeal(MsgExtendDeal) returns (MsgExtendDealResponse);
  rpc GrantDealAuthorization(MsgGrantDealAuthorization) returns (MsgGrantDealAuthorizationResponse);
  rpc RevokeDealAuthorization(MsgRevokeDealAuthorization) returns (MsgRevokeDealAuthorizationResponse);
  rpc AcceptDeal(MsgAcceptDeal) returns (MsgAcceptDealResponse);
  rpc DeclineDeal(MsgDeclineDeal) returns (MsgDeclineDealResponse);
  rpc SubmitProofs(MsgSubmitProofs) returns (MsgSubmitProofsResponse);
  rpc ReleaseReplica(MsgReleaseReplica) returns (MsgReleaseReplicaResponse);
}

// MsgCreateDeal opens a PRIVATE or PUBLIC_PIN user deal. ARCHIVE is rejected.
// granter, when set, must have granted the signer a DealAuthorization; the
// granter pays and the grant's limits apply.
message MsgCreateDeal {
  option (cosmos.msg.v1.signer) = "signer";
  option (amino.name) = "orama/storage/CreateDeal";

  string signer = 1;
  string granter = 2;
  DealClass class = 3;
  bytes deal_nonce = 4;
  string repair_delegate = 5;
  uint32 replicas = 6;
  string price_per_epoch = 7 [
    (gogoproto.customtype) = "cosmossdk.io/math.Int",
    (gogoproto.nullable) = false
  ];
  uint64 duration_epochs = 8;
  // PRIVATE: one commitment per replica. PUBLIC_PIN: exactly one, copied onto
  // every slot (retrievability, not unique storage).
  repeated PieceCommitment pieces = 9 [(gogoproto.nullable) = false];
}

message MsgCreateDealResponse {
  uint64 deal_id = 1;
}

// MsgExtendDeal adds epochs to a user deal and escrows the extra price.
// It does not change the current epoch's subsidy.
message MsgExtendDeal {
  option (cosmos.msg.v1.signer) = "signer";
  option (amino.name) = "orama/storage/ExtendDeal";

  string signer = 1;
  uint64 deal_id = 2;
  uint64 extra_epochs = 3;
}

message MsgExtendDealResponse {}

message MsgGrantDealAuthorization {
  option (cosmos.msg.v1.signer) = "signer";
  option (amino.name) = "orama/storage/GrantDealAuth";

  string signer = 1;
  string grantee = 2;
  string spend_limit = 3 [
    (gogoproto.customtype) = "cosmossdk.io/math.Int",
    (gogoproto.nullable) = false
  ];
  uint64 period_epochs = 4;
  uint64 max_piece_bytes = 5;
  uint64 max_duration_epochs = 6;
  uint32 replicas = 7;
  uint64 expiry_epoch = 8;
}

message MsgGrantDealAuthorizationResponse {}

message MsgRevokeDealAuthorization {
  option (cosmos.msg.v1.signer) = "signer";
  option (amino.name) = "orama/storage/RevokeDealAuth";

  string signer = 1;
  string grantee = 2;
}

message MsgRevokeDealAuthorizationResponse {}

// MsgAcceptDeal is signed by the assigned node's hot key.
message MsgAcceptDeal {
  option (cosmos.msg.v1.signer) = "signer";
  option (amino.name) = "orama/storage/AcceptDeal";

  string signer = 1;
  string node_id = 2;
  uint64 deal_id = 3;
  uint32 slot = 4;
}

message MsgAcceptDealResponse {}

// MsgDeclineDeal is signed by the assigned node's hot key. It has no penalty;
// the slot is reassigned.
message MsgDeclineDeal {
  option (cosmos.msg.v1.signer) = "signer";
  option (amino.name) = "orama/storage/DeclineDeal";

  string signer = 1;
  string node_id = 2;
  uint64 deal_id = 3;
  uint32 slot = 4;
  string reason = 5;
}

message MsgDeclineDealResponse {}

// MsgSubmitProofs carries one or more challenge proofs. A provider may submit
// several of these transactions in the same epoch.
message MsgSubmitProofs {
  option (cosmos.msg.v1.signer) = "signer";
  option (amino.name) = "orama/storage/SubmitProofs";

  string signer = 1;
  string node_id = 2;
  repeated ReplicaProof proofs = 3 [(gogoproto.nullable) = false];
}

message MsgSubmitProofsResponse {}

// ReplicaProof is one leaf-inclusion proof for a challenged slot.
message ReplicaProof {
  uint64 deal_id = 1;
  uint32 slot = 2;
  uint64 leaf_index = 3;
  bytes leaf = 4;
  repeated bytes siblings = 5;
}

// MsgReleaseReplica drops a replica for a legal reason. It is rate-limited
// and does not slash.
message MsgReleaseReplica {
  option (cosmos.msg.v1.signer) = "signer";
  option (amino.name) = "orama/storage/ReleaseReplica";

  string signer = 1;
  string node_id = 2;
  uint64 deal_id = 3;
  uint32 slot = 4;
  ReleaseReason reason = 5;
}

message MsgReleaseReplicaResponse {}
