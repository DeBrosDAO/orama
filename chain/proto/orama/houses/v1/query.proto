syntax = "proto3";
package orama.houses.v1;

option go_package = "github.com/DeBrosOfficial/network/chain/x/houses/types";

import "gogoproto/gogo.proto";
import "orama/houses/v1/houses.proto";

// Query is the gRPC querier for x/houses.
service Query {
  rpc Params(QueryParamsRequest) returns (QueryParamsResponse);
  rpc Proposal(QueryProposalRequest) returns (QueryProposalResponse);
  rpc Vote(QueryVoteRequest) returns (QueryVoteResponse);
  rpc HouseBond(QueryHouseBondRequest) returns (QueryHouseBondResponse);
  rpc Tiers(QueryTiersRequest) returns (QueryTiersResponse);
  rpc Enacted(QueryEnactedRequest) returns (QueryEnactedResponse);
  rpc Invariants(QueryInvariantsRequest) returns (QueryInvariantsResponse);
}

message QueryParamsRequest {}

message QueryParamsResponse {
  Params params = 1 [(gogoproto.nullable) = false];
}

message QueryProposalRequest {
  uint64 proposal_id = 1;
}

message QueryProposalResponse {
  Proposal proposal = 1 [(gogoproto.nullable) = false];
}

message QueryVoteRequest {
  uint64 proposal_id = 1;
  string voter = 2;
}

message QueryVoteResponse {
  Vote vote = 1 [(gogoproto.nullable) = false];
}

message QueryHouseBondRequest {
  string address = 1;
}

message QueryHouseBondResponse {
  HouseBond bond = 1 [(gogoproto.nullable) = false];
}

message QueryTiersRequest {}

message QueryTiersResponse {
  bool parameter_open = 1;
  bool structural_open = 2;
  string lambda = 3 [
    (gogoproto.customtype) = "cosmossdk.io/math.LegacyDec",
    (gogoproto.nullable) = false
  ];
  string bonded_stake = 4 [
    (gogoproto.customtype) = "cosmossdk.io/math.Int",
    (gogoproto.nullable) = false
  ];
  uint64 eligible_operators = 5;
  uint64 distinct_prefix16 = 6;
  uint64 distinct_asn = 7;
}

message QueryEnactedRequest {}

message QueryEnactedResponse {
  Enacted enacted = 1 [(gogoproto.nullable) = false];
}

message QueryInvariantsRequest {}

message QueryInvariantsResponse {
  bool bonds_match_module = 1;
  string detail = 2;
}
