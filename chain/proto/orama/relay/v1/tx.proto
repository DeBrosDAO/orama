syntax = "proto3";
package orama.relay.v1;

option go_package = "github.com/DeBrosOfficial/network/chain/x/relay/types";

import "gogoproto/gogo.proto";
import "cosmos_proto/cosmos.proto";
import "cosmos/msg/v1/msg.proto";
import "orama/relay/v1/relay.proto";

// Msg defines x/relay's message service. There is no admin key and no
// parameter update. Jailing is not a message: the only jail path is
// Keeper.JailRelay, which a governance caller uses after a passed
// structural proposal. This module never slashes.
service Msg {
  option (cosmos.msg.v1.service) = true;

  // RegisterRelay records a relay's RSA identity digest, cross-signed by
  // the ed25519 identity bound to node_id. The per-relay bond is not
  // escrowed here (that is x/nodes).
  rpc RegisterRelay(MsgRegisterRelay) returns (MsgRegisterRelayResponse);

  // ReportEpoch submits one chunk of an epoch report. The report counts
  // once every chunk is present and inputs_root matches the canonical
  // entries.
  rpc ReportEpoch(MsgReportEpoch) returns (MsgReportEpochResponse);

  // UpdateReporters replaces the reporter set. It is rejected unless the
  // caller has set AllowReporterChange on the context. x/houses must do
  // that only while executing a passed structural proposal. This module
  // never sets the flag. signer is not an authority.
  rpc UpdateReporters(MsgUpdateReporters) returns (MsgUpdateReportersResponse);
}

// MsgRegisterRelay adds the RSA identity digest for a node whose RELAY
// binding is already known to NodeView.
message MsgRegisterRelay {
  option (cosmos.msg.v1.signer) = "operator";

  string operator = 1 [(cosmos_proto.scalar) = "cosmos.AddressString"];
  string node_id = 2;
  bytes rsa_fingerprint = 3;
  bool exit = 4;
  // ed25519_signature is the node's ed25519 identity signature over the
  // canonical cross-cert message (node_id and rsa_fingerprint).
  bytes ed25519_signature = 5;
}

message MsgRegisterRelayResponse {}

// MsgReportEpoch is one chunk of {rsa_fingerprint, ed25519_id,
// consensus_weight, flags, uptime_fraction}, plus inputs_root over the
// canonical encoding of every chunk's entries in chunk_index order.
message MsgReportEpoch {
  option (cosmos.msg.v1.signer) = "reporter";

  string reporter = 1 [(cosmos_proto.scalar) = "cosmos.AddressString"];
  uint64 epoch = 2;
  uint32 chunk_index = 3;
  uint32 chunk_count = 4;
  repeated RelayObservation entries = 5 [(gogoproto.nullable) = false];
  bytes inputs_root = 6;
}

message MsgReportEpochResponse {
  bool complete = 1;
}

// MsgUpdateReporters replaces the genesis reporter set. Authorization is
// the context flag, not signer: there is no admin key on this module.
message MsgUpdateReporters {
  option (cosmos.msg.v1.signer) = "signer";

  string signer = 1 [(cosmos_proto.scalar) = "cosmos.AddressString"];
  repeated string reporters = 2;
}

message MsgUpdateReportersResponse {}
