syntax = "proto3";
package orama.relay.v1;

option go_package = "github.com/DeBrosOfficial/network/chain/x/relay/types";

import "cosmos/base/query/v1beta1/pagination.proto";
import "google/api/annotations.proto";
import "gogoproto/gogo.proto";
import "orama/relay/v1/relay.proto";

// Query defines the gRPC querier service for x/relay.
service Query {
  rpc Params(QueryParamsRequest) returns (QueryParamsResponse) {
    option (google.api.http).get = "/orama/relay/v1/params";
  }
  rpc Reporters(QueryReportersRequest) returns (QueryReportersResponse) {
    option (google.api.http).get = "/orama/relay/v1/reporters";
  }
  rpc Relay(QueryRelayRequest) returns (QueryRelayResponse) {
    option (google.api.http).get = "/orama/relay/v1/relay/{rsa_fingerprint_hex}";
  }
  rpc Relays(QueryRelaysRequest) returns (QueryRelaysResponse) {
    option (google.api.http).get = "/orama/relay/v1/relays";
  }
  rpc OperatorRelays(QueryOperatorRelaysRequest) returns (QueryOperatorRelaysResponse) {
    option (google.api.http).get = "/orama/relay/v1/operator-relays/{operator}";
  }
  rpc RelayPayouts(QueryRelayPayoutsRequest) returns (QueryRelayPayoutsResponse) {
    option (google.api.http).get = "/orama/relay/v1/payouts/{epoch}";
  }
  rpc EpochResult(QueryEpochResultRequest) returns (QueryEpochResultResponse) {
    option (google.api.http).get = "/orama/relay/v1/epoch-result/{epoch}";
  }
  rpc Invariants(QueryInvariantsRequest) returns (QueryInvariantsResponse) {
    option (google.api.http).get = "/orama/relay/v1/invariants";
  }
}

message QueryParamsRequest {}

message QueryParamsResponse {
  Params params = 1 [(gogoproto.nullable) = false];
}

message QueryReportersRequest {}

message QueryReportersResponse {
  repeated string reporters = 1;
}

message QueryRelayRequest {
  // rsa_fingerprint_hex is the 20-byte fingerprint, hex-encoded.
  string rsa_fingerprint_hex = 1;
}

message QueryRelayResponse {
  Relay relay = 1 [(gogoproto.nullable) = false];
}

// QueryRelaysRequest pages through every registered relay in RSA fingerprint order.
message QueryRelaysRequest {
  cosmos.base.query.v1beta1.PageRequest pagination = 1;
}

message QueryRelaysResponse {
  repeated Relay relays = 1 [(gogoproto.nullable) = false];
  cosmos.base.query.v1beta1.PageResponse pagination = 2;
}

message QueryOperatorRelaysRequest {
  string operator = 1;
  cosmos.base.query.v1beta1.PageRequest pagination = 2;
}

message QueryOperatorRelaysResponse {
  repeated RelayStanding relays = 1 [(gogoproto.nullable) = false];
  cosmos.base.query.v1beta1.PageResponse pagination = 2;
}

message QueryRelayPayoutsRequest {
  uint64 epoch = 1;
  cosmos.base.query.v1beta1.PageRequest pagination = 2;
}

message QueryRelayPayoutsResponse {
  repeated RelayPayout payouts = 1 [(gogoproto.nullable) = false];
  cosmos.base.query.v1beta1.PageResponse pagination = 2;
}

message QueryEpochResultRequest {
  uint64 epoch = 1;
}

message QueryEpochResultResponse {
  EpochResult result = 1 [(gogoproto.nullable) = false];
}

message QueryInvariantsRequest {}

message QueryInvariantsResponse {
  bool ceiling_holds = 1;
  bool payouts_match = 2;
  string detail = 3;
}
