name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  build-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0  # Need full history for changelog

      - name: Verify VERSION file matches release tag
        run: |
          TAG="${GITHUB_REF_NAME}"
          EXPECTED="${TAG#v}"
          EXPECTED="${EXPECTED%-nightly}"
          ACTUAL=$(tr -d '[:space:]' < VERSION)
          if [ "$EXPECTED" != "$ACTUAL" ]; then
            echo "::error::Tag $TAG implies version '$EXPECTED' but /VERSION says '$ACTUAL'."
            echo "::error::Run 'make -C core bump VER=$EXPECTED' and commit before tagging."
            exit 1
          fi
          echo "VERSION file matches tag: $ACTUAL"

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.2'
          cache-dependency-path: core/go.sum

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          distribution: goreleaser
          version: '~> v2'
          args: release --clean
        env:
          # Use a PAT (not the default GITHUB_TOKEN) so the GitHub Release this
          # creates FIRES the `release: published` event — GITHUB_TOKEN-created
          # releases are suppressed by GitHub's anti-recursion rule, which
          # otherwise means publish-sdk.yml + release-apt.yml never auto-run.
          # Falls back to GITHUB_TOKEN if the PAT secret is absent.
          GITHUB_TOKEN: ${{ secrets.RELEASE_PAT || secrets.GITHUB_TOKEN }}
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}

      - name: Upload artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-artifacts
          path: dist/
          retention-days: 5

  # Verify release artifacts
  verify-release:
    runs-on: ubuntu-latest
    needs: build-release
    if: startsWith(github.ref, 'refs/tags/')

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-artifacts
          path: dist/

      - name: List release artifacts
        run: |
          echo "=== Release Artifacts ==="
          ls -la dist/
          echo ""
          echo "=== .deb packages ==="
          ls -la dist/*.deb 2>/dev/null || echo "No .deb files found"
          echo ""
          echo "=== Archives ==="
          ls -la dist/*.tar.gz 2>/dev/null || echo "No .tar.gz files found"
