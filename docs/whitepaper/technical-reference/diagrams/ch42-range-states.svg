e="text-anchor:middle;font-size:16px"><tspan x="1943" dy="0">Archived</tspan><tspan x="1943" dy="17.666667">3 operators and 3 live recorded deals</tspan><tspan x="1943" dy="17.666667">(permanent flag)</tspan></text></g><g class="KG5vbmUgLSZndDsgY2FuZClbMF0="><marker id="mk-d2-3846590572-3488378134" markerWidth="10" markerHeight="12" refX="7" refY="6" viewBox="0 0 10 12" orient="auto" markerUnits="userSpaceOnUse"> <polygon points="0,0 10,6 0,12" fill="#0D32B2" class="connection fill-B1" stroke-width="2" /> </marker><path d="M 173 158 L 429 158" stroke="#0D32B2" fill="none" class="connection stroke-B1" style="stroke-width:2;" marker-end="url(#mk-d2-3846590572-3488378134)" mask="url(#d2-3846590572)" /><text x="302" y="164" fill="#676C7E" class="text-italic fill-N2" style="text-anchor:middle;font-size:16px">first MsgAttest</text></g><g class="KGNhbmQgLSZndDsgY2FuZClbMF0="><path d="M 506.5 107 L 506.5 69 S 506.5 59 516.5 59 L 570.5 59 S 580.5 59 580.5 69 L 580.5 105" stroke="#0D32B2" fill="none" class="connection stroke-B1" style="stroke-width:2;" marker-end="url(#mk-d2-3846590572-3488378134)" mask="url(#d2-3846590572)" /><text x="543.5" y="57" fill="#676C7E" class="text-italic fill-N2" style="text-anchor:middle;font-size:16px"><tspan x="543.5" dy="0">more attestations; a candidate whose</tspan><tspan x="543.5" dy="18.5">attesters all lost the ARCHIVER role is freed</tspan></text></g><g class="KGNhbmQgLSZndDsgZGVjKVswXQ=="><path d="M 656.5 158 L 1072.5 158" stroke="#0D32B2" fill="none" class="connection stroke-B1" style="stroke-width:2;" marker-end="url(#mk-d2-3846590572-3488378134)" mask="url(#d2-3846590572)" /><text x="866" y="164" fill="#676C7E" class="text-italic fill-N2" style="text-anchor:middle;font-size:16px">one tuple reaches 3 distinct operators</text></g><g class="KGRlYyAtJmd0OyBkZWMpWzBd"><path d="M 1160.833008 99 L 1160.833008 61 S 1160.833008 51 1170.833008 51 L 1235.166016 51 S 1245.166016 51 1245.166016 61 L 1245.166016 97" stroke="#0D32B2" fill="none" class="connection stroke-B1" style="stroke-width:2;" marker-end="url(#mk-d2-3846590572-3488378134)" mask="url(#d2-3846590572)" /><text x="1203" y="49" fill="#676C7E" class="text-italic fill-N2" style="text-anchor:middle;font-size:16px"><tspan x="1203" dy="0">MsgCreateArchiveDeal (at most 3 live),</tspan><tspan x="1203" dy="18.5">MsgAttachReplicas, more attesters (to 64)</tspan></text></g><g class="KGRlYyAtJmd0OyBhcmMpWzBd"><path d="M 1331 158 L 1786 158" stroke="#0D32B2" fill="none" class="connection stroke-B1" style="stroke-width:2;" marker-end="url(#mk-d2-3846590572-3488378134)" mask="url(#d2-3846590572)" /><text x="1560" y="164" fill="#676C7E" class="text-italic fill-N2" style="text-anchor:middle;font-size:16px">3 attesters and 3 active ARCHIVE deals recorded</text></g><g class="KGFyYyAtJmd0OyBhcmMpWzBd"><path d="M 1892 107 L 1892 69 S 1892 59 1902 59 L 1984 59 S 1994 59 1994 69 L 1994 105" stroke="#0D32B2" fill="none" class="connection stroke-B1" style="stroke-width:2;" marker-end="url(#mk-d2-3846590572-3488378134)" mask="url(#d2-3846590572)" /><text x="1943.5" y="57" fill="#676C7E" class="text-italic fill-N2" style="text-anchor:middle;font-size:16px"><tspan x="1943.5" dy="0">last archived height extends</tspan><tspan x="1943.5" dy="18.5">over the contiguous archived prefix</tspan></text></g><mask id="d2-3846590572" maskUnits="userSpaceOnUse" x="-89" y="-67" width="2286" height="383">
