nodes; SafeToRemoveMember(old id)</text></g><g class="KGNsaSAtJmd0OyBzKVsyXQ=="><path d="M 128 615 L 520 615" stroke="#0D32B2" fill="none" class="connection stroke-B1" style="stroke-width:2;" marker-end="url(#mk-d2-526642672-3488378134)" mask="url(#d2-526642672)" /><text x="325.5" y="621" fill="#676C7E" class="text-italic fill-N2" style="text-anchor:middle;font-size:16px">DELETE /remove {old id}</text></g><g class="KGNsaSAtJmd0OyBzKVszXQ=="><path d="M 128 705 L 520 705" stroke="#0D32B2" fill="none" class="connection stroke-B1" style="stroke-width:2;" marker-end="url(#mk-d2-526642672-3488378134)" mask="url(#d2-526642672)" /><text x="325.5" y="711" fill="#676C7E" class="text-italic fill-N2" style="text-anchor:middle;font-size:16px">INSERT raft_evicted_nodes (old id, new peer id)</text></g><g class="KGNsaSAtJmd0OyB0KVsxXQ=="><path d="M 128 811 L 892.5 811" stroke="#0D32B2" fill="none" class="connection stroke-B1" style="stroke-width:2;" marker-end="url(#mk-d2-526642672-3488378134)" mask="url(#d2-526642672)" /><text x="511" y="801" fill="#676C7E" class="text-italic fill-N2" style="text-anchor:middle;font-size:16px"><tspan x="511" dy="0">stop rqlite@index; rm raft.db, snapshots, raft/, db.sqlite*;</tspan><tspan x="511" dy="17.666667">write raft-node-id = peer id;</tspan><tspan x="511" dy="17.666667">rewrite rqlite.env: -node-id, JOIN_ARGS; start</tspan></text></g><g class="KHQgLSZndDsgcylbMF0="><path d="M 894.5 917 L 528 917" stroke="#0D32B2" fill="none" class="connection stroke-B1" style="stroke-width:2;" marker-end="url(#mk-d2-526642672-3488378134)" mask="url(#d2-526642672)" /><text x="710" y="923" fill="#676C7E" class="text-italic fill-N2" style="text-anchor:middle;font-size:16px">join under the peer id, replicate from the leader</text></g><g class="KGNsaSAtJmd0OyBzKVs0XQ=="><path d="M 128 1007 L 520 1007" stroke="#0D32B2" fill="none" class="connection stroke-B1" style="stroke-width:2;" marker-end="url(#mk-d2-526642672-3488378134)" mask="url(#d2-526642672)" /><text x=