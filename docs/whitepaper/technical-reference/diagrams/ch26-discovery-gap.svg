		.d2-1304210299 .stroke-B2{stroke:#0D32B2;}.appendix text.text{fill:#0A0F25}.md{--color-fg-default:#0A0F25;--color-fg-muted:#676C7E;--color-fg-subtle:#9499AB;--color-canvas-default:#FFFFFF;--color-canvas-subtle:#EEF1F8;--color-border-default:#0D32B2;--color-border-muted:#0D32B2;--color-neutral-muted:#EEF1F8;--color-accent-fg:#0D32B2;--color-accent-emphasis:#0D32B2;--color-attention-subtle:#676C7E;--color-danger-fg:red;}.light-code{display: block}.dark-code{display: none}]]></style><g class="d3JpdGVy"><g class="shape" ><rect x="388" y="12" width="358" height="66" stroke="#0D32B2" fill="#F7F8FE" class=" stroke-B1 fill-B6" style="stroke-width:2;" /></g><text x="567" y="50.5" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:16px">Who writes per-namespace TURN files today</text></g><g class="bm9uZQ=="><g class="shape" ><rect x="12" y="166" width="342" height="82" stroke="#0D32B2" fill="#F7F8FE" class=" stroke-B1 fill-B6" style="stroke-width:2;" /></g><text x="183" y="204.5" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:16px"><tspan x="183" dy="0">Nobody. No code path writes</tspan><tspan x="183" dy="18.5">namespaces/ns/configs/turn-nodeID.yaml</tspan></text></g><g class="c3dlZXA="><g class="shape" ><rect x="374" y="158" width="387" height="98" stroke="#0D32B2" fill="#F7F8FE" class=" stroke-B1 fill-B6" style="stroke-width:2;" /></g><text x="567.5" y="196.5" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:16px"><tspan x="567.5" dy="0">ReconcileHostTURN sweep (about every minute)</tspan><tspan x="567.5" dy="17.666667">removeLegacyTURNConfig deletes</tspan><tspan x="567.5" dy="17.666667">configs/turn-localNodeID.yaml</tspan></text></g><g class="c2hhcmVk"><g class="shape" ><rect x="1126" y="158" width="390" height="98" stroke="#0D32B2" fill="#F7F8FE" class=" stroke-B1 fill-B6" style="stroke-width:2;" /></g><text x="1321" y="196.5" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:16px"><tspan x="1321" dy="0">applyHostTURN writes the only live TURN config:</tspan><tspan x="1321" dy="17.666667">data/turn/turn.yaml</tspan><tspan x="1321" dy="17.666667">(tenants: list, one turns_listen_addr)</tspan></text></g><g class="c2Nhbg=="><g class="shape" ><rect x="781" y="174" width="325" height="82" stroke="#0D32B2" fill="#F7F8FE" class=" stroke-B1 fill-B6" style="stroke-width:2;" /></g><text x="943.5" y="212.5" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:16px"><tspan x="943.5" dy="0">DiscoverTURNRoutes</tspan><tspan x="943.5" dy="18.5">glob namespaces/*/configs/turn-*.yaml</tspan></text></g><g class="ZW1wdHk="><g class="shape" ><rect x="447" y="344" width="240" height="66" stroke="#0D32B2" fill="#F7F8FE" class=" stroke-B1 fill-B6" style="stroke-width:2;" /></g><text x="567" y="382.5" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:16px">no match in any namespace</text></g><g class="cm91dGVz"><g class="shape" ><rect x="401" y="504" width="332" height="82" stroke="#0D32B2" fill="#F7F8FE" class=" stroke-B1 fill-B6" style="stroke-width:2;" /></g><text x="567" y="542.5" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:16px"><tspan x="567" dy="0">routes = empty</tspan><tspan x="567" dy="18.5">only the fallback to Caddy :8443 remains</tspan></text></g><g class="cmVzdWx0"><g class="shape" ><rect x="406" y="656" width="322" height="82" stroke="#0D32B2" fill="#F7F8FE" class=" stroke-B1 fill-B6" style="stroke-width:2;" /></g><text x="567" y="694.5" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:16px"><tspan x="567" dy="0">SNI cdn-hash.base reaches Caddy,</tspan><tspan x="567" dy="18.5">which speaks HTTP: TURN allocate fails</tspan></text></g><g class="dW5yZWFk"><g class="shape" ><rect x="1153" y="336" width="335" height="98" stroke="#0D32B2" fill="#F7F8FE" class=" stroke-B1 fill-B6" style="stroke-width:2;" /></g><text x="1320.5" y="374.5" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:16px"><tspan x="1320.5" dy="0">turn.yaml is never read by the router.</tspan><tspan x="1320.5" dy="17.666667">Its shape has no top-level namespace:</tspan><tspan x="1320.5" dy="17.666667">parseTURNConfig would reject it anyway</tspan></text></g><g class="KHdyaXRlciAtJmd0OyBub25lKVswXQ=="><marker id="mk-d2-1304210299-3488378134" markerWidth="10" markerHeight="12" refX="7" refY="6" viewBox="0 0 10 12" orient="auto" markerUnits="userSpaceOnUse"> <polygon points="0,0 10,6 0,12" fill="#0D32B2" class="connection fill-B1" stroke-width="2" /> </marker><path d="M 478 80 L 478 108 S 478 118 468 118 L 193 118 S 183 118 183 128 L 183 162" stroke="#0D32B2" fill="none" class="connection stroke-B1" style="stroke-width:2;" marker-end="url(#mk-d2-1304210299-3488378134)" mask="url(#d2-1304210299)" /></g><g class="KHdyaXRlciAtJmd0OyBzd2VlcClbMF0="><path d="M 567.5 80 L 567.5 154" stroke="#0D32B2" fill="none" class="connection stroke-B1" style="stroke-width:2;" marker-end="url(#mk-d2-1304210299-3488378134)" mask="url(#d2-1304210299)" /></g><g class="KHdyaXRlciAtJmd0OyBzaGFyZWQpWzBd"><path d="M 657 80 L 657 108 S 657 118 667 118 L 1311 118 S 1321 118 1321 128 L 1321 154" stroke="#0D32B2" fill="none" class="connection stroke-B1" style="stroke-width:2;" marker-end="url(#mk-d2-1304210299-3488378134)" mask="url(#d2-1304210299)" /></g><g class="KHNjYW4gLSZndDsgZW1wdHkpWzBd"><path d="M 943.5 258 L 943.5 286 S 943.5 296 933.5 296 L 637.5 296 S 627.5 296 627.5 306 L 627.5 340" stroke="#0D32B2" fill="none" class="connection stroke-B1" style="stroke-width:2;" marker-end="url(#mk-d2-1304210299-3488378134)" mask="url(#d2-1304210299)" /></g><g class="KG5vbmUgLSZndDsgZW1wdHkpWzBd"><path d="M 183 250 L 183 286 S 183 296 193 296 L 497.5 296 S 507.5 296 507.5 306 L 507.5 340" stroke="#0D32B2" fill="none" class="connection stroke-B1" style="stroke-width:2;" marker-end="url(#mk-d2-1304210299-3488378134)" mask="url(#d2-1304210299)" /></g><g class="KHN3ZWVwIC0mZ3Q7IGVtcHR5KVswXQ=="><path d="M 567.5 258 L 567.5 340" stroke="#0D32B2" fill="none" class="connection stroke-B1" style="stroke-width:2;" marker-end="url(#mk-d2-1304210299-3488378134)" mask="url(#d2-1304210299)" /></g><g class="KGVtcHR5IC0mZ3Q7IHJvdXRlcylbMF0="><path d="M 567.5 412 L 567.5 500" stroke="#0D32B2" fill="none" class="connection stroke-B1" style="stroke-width:2;" marker-end="url(#mk-d2-1304210299-3488378134)" mask="url(#d2-1304210299)" /></g><g class="KHJvdXRlcyAtJmd0OyByZXN1bHQpWzBd"><path d="M 567.5 588 L 567.5 652" stroke="#0D32B2" fill="none" class="connection stroke-B1" style="stroke-width:2;" marker-end="url(#mk-d2-1304210299-3488378134)" mask="url(#d2-1304210299)" /></g><g class="KHNoYXJlZCAtJmd0OyB1bnJlYWQpWzBd"><path d="M 1321 258 L 1321 332" stroke="#0D32B2" fill="none" class="connection stroke-B1" style="stroke-width:2;" marker-end="url(#mk-d2-1304210299-3488378134)" mask="url(#d2-1304210299)" /></g><mask id="d2-1304210299" maskUnits="userSpaceOnUse" x="-89" y="-89" width="1706" height="928">
