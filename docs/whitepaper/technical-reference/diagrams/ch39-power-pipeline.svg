		.d2-3967674004 .stroke-B2{stroke:#0D32B2;}.appendix text.text{fill:#0A0F25}.md{--color-fg-default:#0A0F25;--color-fg-muted:#676C7E;--color-fg-subtle:#9499AB;--color-canvas-default:#FFFFFF;--color-canvas-subtle:#EEF1F8;--color-border-default:#0D32B2;--color-border-muted:#0D32B2;--color-neutral-muted:#EEF1F8;--color-accent-fg:#0D32B2;--color-accent-emphasis:#0D32B2;--color-attention-subtle:#676C7E;--color-danger-fg:red;}.light-code{display: block}.dark-code{display: none}]]></style><g class="c3Rha2U="><g class="shape" ><rect x="554" y="12" width="282" height="98" stroke="#0D32B2" fill="#F7F8FE" class=" stroke-B1 fill-B6" style="stroke-width:2;" /></g><text x="695" y="50.5" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:16px"><tspan x="695" dy="0">bonded validators from x/staking</tspan><tspan x="695" dy="17.666667">not jailed, not tombstoned</tspan><tspan x="695" dy="17.666667">stake = bonded tokens</tspan></text></g><g class="ZnVsbA=="><g class="shape" ><rect x="359" y="190" width="338" height="98" stroke="#0D32B2" fill="#F7F8FE" class=" stroke-B1 fill-B6" style="stroke-width:2;" /></g><text x="528" y="228.5" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:16px"><tspan x="528" dy="0">full capped shares</tspan><tspan x="528" dy="17.666667">ComputeCappedShares(stake, cap, 2x)</tspan><tspan x="528" dy="17.666667">(latent stake, used by the lambda limiter)</tspan></text></g><g class="cmFtcA=="><g class="shape" ><rect x="717" y="198" width="288" height="82" stroke="#0D32B2" fill="#F7F8FE" class=" stroke-B1 fill-B6" style="stroke-width:2;" /></g><text x="861" y="236.5" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:16px"><tspan x="861" dy="0">effectiveBond: only tokens whose</tspan><tspan x="861" dy="18.5">30-epoch ramp has admitted them</tspan></text></g><g class="YWRtaXR0ZWQ="><g class="shape" ><rect x="667" y="358" width="387" height="82" stroke="#0D32B2" fill="#F7F8FE" class=" stroke-B1 fill-B6" style="stroke-width:2;" /></g><text x="860.5" y="396.5" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:16px"><tspan x="860.5" dy="0">admitted capped shares C_i</tspan><tspan x="860.5" dy="18.5">ComputeCappedShares(admitted stake, cap, 2x)</tspan></text></g><g class="Ym9vdA=="><g class="shape" ><rect x="12" y="558" width="306" height="98" stroke="#0D32B2" fill="#F7F8FE" class=" stroke-B1 fill-B6" style="stroke-width:2;" /></g><text x="165" y="596.5" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:16px"><tspan x="165" dy="0">bootstrap share B_i = 1/n</tspan><tspan x="165" dy="17.666667">only if the seat is eligible</tspan><tspan x="165" dy="17.666667">(bonded, not jailed, not tombstoned)</tspan></text></g><g class="bGFtYmRh"><g class="shape" ><rect x="338" y="510" width="380" height="146" stroke="#0D32B2" fill="#F7F8FE" class=" stroke-B1 fill-B6" style="stroke-width:2;" /></g><text x="528" y="548.5" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:16px"><tspan x="528" dy="0">lambda (stored, monotonic)</tspan><tspan x="528" dy="16.833333">recomputed once per closed epoch</tspan><tspan x="528" dy="16.833333">max(prev, bonded/exit stake, epochs/deadline)</tspan><tspan x="528" dy="16.833333">held at 0.95 until the handover gate is met</tspan><tspan x="528" dy="16.833333">candidate scaled back until the voting-power</tspan><tspan x="528" dy="16.833333">shift it causes is at most 1/3</tspan></text></g><g class="cmF3"><g class="shape" ><rect x="386" y="736" width="284" height="66" stroke="#0D32B2" fill="#F7F8FE" class=" stroke-B1 fill-B6" style="stroke-width:2;" /></g><text x="528" y="774.5" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:16px">P_i = (1 - lambda) B_i + lambda C_i</text></g><g class="bm9ybQ=="><g class="shape" ><rect x="409" y="872" width="238" height="66" stroke="#0D32B2" fill="#F7F8FE" class=" stroke-B1 fill-B6" style="stroke-width:2;" /></g><text x="528" y="910.5" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:16px">normalise by the sum of P_i</text></g><g class="bGltaXQ="><g class="shape" ><rect x="302" y="1008" width="452" height="98" stroke="#0D32B2" fill="#F7F8FE" class=" stroke-B1 fill-B6" style="stroke-width:2;" /></g><text x="528" y="1046.5" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:16px"><tspan x="528" dy="0">limitPublishedIncreases, every block</tspan><tspan x="528" dy="17.666667">total variation from the last published powers at most 1/3</tspan><tspan x="528" dy="17.666667">increases scaled back, decreases applied at once</tspan></text></g><g class="Y29tZXQ="><g class="shape" ><rect x="348" y="1176" width="359" height="82" stroke="#0D32B2" fill="#F7F8FE" class=" stroke-B1 fill-B6" style="stroke-width:2;" /></g><text x="527.5" y="1214.5" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:16px"><tspan x="527.5" dy="0">comet power = floor(share x 10^9), at least 1</tspan><tspan x="527.5" dy="18.5">ValidatorUpdate only where it changed</tspan></text></g><g class="KHN0YWtlIC0mZ3Q7IGZ1bGwpWzBd"><marker id="mk-d2-3967674004-3488378134" markerWidth="10" markerHeight="12" refX="7" refY="6" viewBox="0 0 10 12" orient="auto" markerUnits="userSpaceOnUse"> <polygon points="0,0 10,6 0,12" fill="#0D32B2" class="connection fill-B1" stroke-width="2" /> </marker><path d="M 648.5 112 L 648.5 186" stroke="#0D32B2" fill="none" class="connection stroke-B1" style="stroke-width:2;" marker-end="url(#mk-d2-3967674004-3488378134)" mask="url(#d2-3967674004)" /></g><g class="KHN0YWtlIC0mZ3Q7IHJhbXApWzBd"><path d="M 742.5 112 L 742.5 194" stroke="#0D32B2" fill="none" class="connection stroke-B1" style="stroke-width:2;" marker-end="url(#mk-d2-3967674004-3488378134)" mask="url(#d2-3967674004)" /></g><g class="KHJhbXAgLSZndDsgYWRtaXR0ZWQpWzBd"><path d="M 861 282 L 861 354" stroke="#0D32B2" fill="none" class="connection 