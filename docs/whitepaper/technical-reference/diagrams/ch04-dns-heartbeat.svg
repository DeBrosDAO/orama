rect x="601" y="537" width="143" height="66" stroke="#0D32B2" fill="#F7F8FE" class=" stroke-B1 fill-B6" style="stroke-width:2;" /></g><text x="672.5" y="575.5" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:16px">edgeDown + 1</text></g><g class="dHdv"><g class="shape" ><rect x="593" y="683" width="159" height="66" stroke="#0D32B2" fill="#F7F8FE" class=" stroke-B1 fill-B6" style="stroke-width:2;" /></g><text x="672.5" y="721.5" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:16px">edgeDown &gt;= 2?</text></g><g class="d2Q="><g class="shape" ><rect x="316" y="926" width="357" height="98" stroke="#0D32B2" fill="#F7F8FE" class=" stroke-B1 fill-B6" style="stroke-width:2;" /></g><text x="494.5" y="964.5" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:16px"><tspan x="494.5" dy="0">withdrawFromDNS</tspan><tspan x="494.5" dy="17.666667">delete own A records from base names and</tspan><tspan x="494.5" dy="17.666667">ns-name round-robins, never the last record</tspan></text></g><g class="d2FpdA=="><g class="shape" ><rect x="693" y="942" width="314" height="66" stroke="#0D32B2" fill="#F7F8FE" class=" stroke-B1 fill-B6" style="stroke-width:2;" /></g><text x="850" y="980.5" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:16px">keep heartbeating, wait one more tick</text></g><g class="bWFpbnQ="><g class="shape" ><rect x="253" y="1104" width="483" height="130" stroke="#0D32B2" fill="#F7F8FE" class=" stroke-B1 fill-B6" style="stroke-width:2;" /></g><text x="494.5" y="1142.5" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:16px"><tspan x="494.5" dy="0">maintainClusterDNS (every tick, edge up or not)</tspan><tspan x="494.5" dy="17">retract own TURN records without an allocation,</tspan><tspan x="494.5" dy="17">mark nodes silent over 120 s inactive and drop their A records,</tspan><tspan x="494.5" dy="17">purge namespace records of nodes non-active over 15 min,</tspan><tspan x="494.5" dy="17">purge records of namespaces that no longer exist</tspan></text></g><g class="KHRpY2sgLSZndDsgaGIpWzBd"><marker id="mk-d2-4277206572-3488378134" markerWidth="10" markerHeight="12" refX="7" refY="6" viewBox="0 0 10 12" orient="auto" markerUnits="userSpaceOnUse"> <polygon points="0,0 10,6 0,12" fill="#0D32B2" class="connection fill-B1" stroke-width="2" /> </marker><path d="M 510.75 80 L 510.75 144" stroke="#0D32B2" fill="none" class="connection stroke-B1" style="stroke-width:2;" marker-end="url(#mk-d2-4277206572-3488378134)" mask="url(#d2-4277206572)" /></g><g class="KGhiIC0mZ3Q7IGNoaylbMF0="><path d="M 510.75 232 L 510.75 296" stroke="#0D32B2" fill="none" class="connection stroke-B1" style="stroke-width:2;" marker-end="url(#mk-d2-4277206572-3488378134)" mask="url(#d2-4277206572)" /></g><g class="KGNoayAtJmd0OyBvaylbMF0="><path d="M 432.415985 368 L 432.415985 669" stroke="#0D32B2" fill="none" class="connection stroke-B1" style="stroke-width:2;" marker-end="url(#mk-d2-4277206572-3488378134)" mask="url(#d2-4277206572)" /><text x="432.5" y="525" fill="#676C7E" class="text-italic fill-N2" style="text-anchor:middle;font-size:16px">yes</text></g><g class="KGNoayAtJmd0OyBtaXNzKVswXQ=="><path d="M 672.75 368 L 672.75 533" stroke="#0D32B2" fill="none" class="connection stroke-B1" style="stroke-width:2;" marker-end="url(#mk-d2-4277206572-3488378134)" mask="url(#d2-4277206572)" /><text x="672.5" y="457" fill="#676C7E" class="text-italic fill-N2" style="text-anchor:middle;font-size:16px">no</text></g><g class="KG1pc3MgLSZndDsgdHdvKVswXQ=="><path d="M 672.75 604.666016 L 672.75 679.666016" stroke="#0D32B2" fill="none" class="connection stroke-B1" style="stroke-width:2;" marker-end="url(#mk-d2-4277206572-3488378134)" mask="url(#d2-4277206572)" /></g><g class="KHR3byAtJmd0OyB3ZClbMF0="><path d="M 646.25 752 L 646.25 922" stroke="#0D32B2" fill="none" class="connection stroke-B1" style="stroke-width:2;" marker-end="url(#mk-d2-427720