-B6" style="stroke-width:2;" /></g><text x="245" y="538.5" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:16px"><tspan x="245" dy="0">strip the injected commit</tspan><tspan x="245" dy="18.5">(first transaction), add an empty OK result</tspan></text></g><g class="cHJl"><g class="shape" ><rect x="161" y="652" width="169" height="82" stroke="#0D32B2" fill="#F7F8FE" class=" stroke-B1 fill-B6" style="stroke-width:2;" /></g><text x="245.5" y="690.5" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:16px"><tspan x="245.5" dy="0">PreBlockers</tspan><tspan x="245.5" dy="18.5">1 upgrade   2 auth</tspan></text></g><g class="YmVnaW4="><g class="shape" ><rect x="43" y="804" width="405" height="98" stroke="#0D32B2" fill="#F7F8FE" class=" stroke-B1 fill-B6" style="stroke-width:2;" /></g><text x="245.5" y="842.5" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:16px"><tspan x="245.5" dy="0">BeginBlockers</tspan><tspan x="245.5" dy="17.666667">1 emission (close epoch?)   2 storage   3 distribution</tspan><tspan x="245.5" dy="17.666667">4 slashing   5 evidence   6 staking   7 genutil</tspan></text></g><g class="dHhz"><g class="shape" ><rect x="64" y="972" width="362" height="98" stroke="#0D32B2" fill="#F7F8FE" class=" stroke-B1 fill-B6" style="stroke-width:2;" /></g><text x="245" y="1010.5" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:16px"><tspan x="245" dy="0">each transaction</tspan><tspan x="245" dy="17.666667">ante chain, then messages in a cache branch,</tspan><tspan x="245" dy="17.666667">then post handler (empty)</tspan></text></g><g class="ZW5k"><g class="shape" ><rect x="12" y="1140" width="467" height="130" stroke="#0D32B2" fill="#F7F8FE" class=" stroke-B1 fill-B6" style="stroke-width:2;" /></g><text x="245.5" y="1178.5" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:16px"><tspan x="245.5" dy="0">EndBlockers</tspan><tspan x="245.5" dy="17">bank, shielded, staking (updates discarded), nodes, houses,</tspan><tspan x="245.5" dy="17">storage, relay, genutil, feegrant,</tspan><tspan x="245.5" dy="17">power (the only ValidatorUpdates), fees (next base fee),</tspan><tspan x="245.5" dy="17">emission (ReconcileBurns)</tspan></text></g><g class="Y29tbWl0"><g class="shape" ><rect x="94" y="1340" width="303" height="98" stroke="#0D32B2" fill="#F7F8FE" class=" stroke-B1 fill-B6" style="stroke-width:2;" /></g><text x="245.5" y="1378.5" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:16px"><tspan x="245.5" dy="0">Commit</tspan><tspan x="245.5" dy="17.666667">BaseApp.Commit, then retain height</tspan><tspan x="245.5" dy="17.666667">lowered to the archive&#39;s</tspan></text></g><g class="KHByb3AgLSZndDsgcHJvYylbMF0="><marker id="mk-d2-1254152862-3488378134" markerWidth="10" markerHeight="12" refX="7" refY="6" viewBox="0 0 10 12" orient="auto" markerUnits="userSpaceOnUse"> <polygon points="0,0 10,6 0,12" fill="#0D32B2" class="connection fill-B1" stroke-width="2" /> </marker><path d="M 245.5 128 L 245.5 192" stroke="#0D32B2" fill="none" class="connection stroke-B1" style="stroke-width:2;" marker-end="url(#mk-d2-1254152862-3488378134)" mask="url(#d2-1254152862)" /></g><g class="KHByb2MgLSZndDsgZmluKVswXQ=="><path d="M 245.5 296 L 245.5 360" stroke="#0D32B2" fill="none" class="connection stroke-B1" style="stroke-width:2;" marker-end="url(#mk-d2-1254152862-3488378134)" mask="url(#d2-1254152862)" /></g><g class="KGZpbiAtJmd0OyBzdHJpcClbMF0="><path d="M 245.5 432 L 245.5 496" stroke="#0D32B2" fill="none" class="connection stroke-B1" style="stroke-width:2;" marker-end="url(#mk-d2-1254152862-3488378134)" mask="url(#d2-1254152862)" /></g><g class="KHN0cmlwIC0mZ3Q7IHByZSlbMF0="><path d="M 245.5 584 L 245.5 648" stroke="#0D32B2" fill="none" class="connection stroke-B1" style="stroke-width:2;" marker-end="url(#mk-d2-1254152862-3488378134)" mask="url(#d2-1254152862)" /></g><g class="KHByZS