ext x="333" y="204" fill="#676C7E" class="text-italic fill-N2" style="text-anchor:middle;font-size:16px">POST auth/challenge {identity}</text></g><g class="KGcgLSZndDsgZylbMF0="><path d="M 538.5 278 L 714 278 S 724 278 724 288 L 724 323.5 S 724 333.5 714 333.5 L 540.5 333.5" stroke="#0D32B2" fill="none" class="connection stroke-B1" style="stroke-width:2;" marker-end="url(#mk-d2-2493452718-3488378134)" mask="url(#d2-2493452718)" /><text x="724.5" y="303" fill="#676C7E" class="text-italic fill-N2" style="text-anchor:middle;font-size:16px"><tspan x="724.5" dy="0">32 random bytes</tspan><tspan x="724.5" dy="18.5">tag = HMAC(server_secret, identity, nonce, created_ns)</tspan></text></g><g class="KGcgLSZndDsgYylbMF0="><path d="M 534.5 413.5 L 134 413.5" stroke="#0D32B2" fill="none" class="connection stroke-B1" style="stroke-width:2;" marker-end="url(#mk-d2-2493452718-3488378134)" mask="url(#d2-2493452718)" /><text x="333.5" y="419" fill="#676C7E" class="text-italic fill-N2" style="text-anchor:middle;font-size:16px">nonce, created_ns, tag</text></g><g class="KGMgLSZndDsgZylbMV0="><path d="M 132 503.5 L 532.5 503.5" stroke="#0D32B2" fill="none" class="connection stroke-B1" style="stroke-width:2;" marker-end="url(#mk-d2-2493452718-3488378134)" mask="url(#d2-2493452718)" /><text x="333.5" y="509" fill="#676C7E" class="text-italic fill-N2" style="text-anchor:middle;font-size:16px">POST auth/session {identity, nonce, created_ns, tag}</text></g><g class="KGcgLSZndDsgZylbMV0="><path d="M 538.5 583.5 L 733.5 583.5 S 743.5 583.5 743.5 593.5 L 743.5 629 S 743.5 639 733.5 639 L 540.5 639" stroke="#0D32B2" fill="none" class="connection stroke-B1" style="stroke-width:2;" marker-end="url(#mk-d2-2493452718-3488378134)" mask="url(#d2-2493452718)" /><text x="744" y="609" fill="#676C7E" class="text-italic fill-N2" style="text-anchor:middle;font-size:16px"><tspan x="744" dy="0">age 0..60 s, tag matches (constant time)</tspan><tspan x="744" dy="18.5">tag2 = HMAC(server_secret, identity padded to 64, expiry_ns)</tspan></text></g><g class="KGcgLSZndDsgYylbMV0="><path d="M 534.5 719 L 134 719" stroke="#0D32B2" fill="none" class="connection stroke-B1" style="stroke-width:2;" marker-end="url(#mk-d2-2493452718-3488378134)" mask="url(#d2-2493452718)" /><text x="333.5" y="725" fill="#676C7E" class="text-italic fill-N2" style="text-anchor:middle;font-size:16px">identity, expiry_ns (now + 1 h), tag2</text></g><g class="KGMgLSZndDsgYylbMF0="><path d="M 132 799 L 231 799 S 241 799 241 809 L 241 834 S 241 844 231 844 L 134 844" stroke="#0D32B2" fill="none" class="connection stroke-B1" style="stroke-width:2;" marker-end="url(#mk-d2-2493452718-3488378134)" mask="url(#d2-2493452718)" /><text x="241" y="827" fill="#676C7E" class="text-italic fill-N2" style="text-anchor:middle;font-size:16px">token = identity:expiry_ns:tag2</text></g><g class="KGMgLSZndDsgZylbMl0="><path d="M 132 932 L 532.5 932" stroke="#0D32B2" fill="none" class="connection stroke-B1" style="stroke-width:2;" marker-end="url(#mk-d2-2493452718-3488378134)" mask="url(#d2-2493452718)" /><text x="333" y="930" fill="#676C7E" class="text-italic fill-N2" style="text-anchor:middle;font-size:16px"><tspan x="333" dy="0">request + X-Session-Token</tspan><tspan x="333" dy="18.5">+ Ed25519 proof (body fields V1, X-Vault-* headers V2)</tspan></text></g><g class="KGcgLSZndDsgZylbMl0="><path d="M 538.5 1020 L 793.5 1020 S 803.5 1020 803.5 1030 L 803.5 1089.5 S 803.5 1099.5 793.5 1099.5 L 540.5 1099.5" stroke="#0D32B2" fill="none" class="connection stroke-B1" style="stroke-width:2;" marker-end="url(#mk-d2-2493452718-3488378134)" mask="url(#d2-2493452718)" /><text x="804" y="1049" fill="#676C7E" class="text-italic fill-N2" style="text-anchor:middle;font-size:16px"><tspan x="804" dy="0">token valid, then</tspan><tspan x="804" dy="17.666667">identity = SHA-256(pubkey) and signature over the domain-separated message</tspan><tspan x="804" dy="17.666667">then the handler&#39;s own work</tspan></text></g><g class="KGcgLSZndDsgYylbMl0="><path d="M 534.5 1179.5 L 134 1179.5" stroke="#0D32B2" fill="none" class="connection stroke-B1" style="stroke-width:2;" marker-end="url(#mk-d2-2493452718-3488378134)" mask="url(#d2-2493452718)" /><text x="333" y="1185" fill="#676C7E" class="text-italic fill-N2" style="text-anchor:middle;font-size:16px">200, or 401 (token, proof), 409/400 (version), 429</text></g><mask id="d2-2493452718" maskUnits="userSpaceOnUse" x="-89" y="-49" width="1250" height="1400">
