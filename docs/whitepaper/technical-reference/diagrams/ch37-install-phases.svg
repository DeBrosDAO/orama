		.d2-2162947269 .stroke-B2{stroke:#0D32B2;}.appendix text.text{fill:#0A0F25}.md{--color-fg-default:#0A0F25;--color-fg-muted:#676C7E;--color-fg-subtle:#9499AB;--color-canvas-default:#FFFFFF;--color-canvas-subtle:#EEF1F8;--color-border-default:#0D32B2;--color-border-muted:#0D32B2;--color-neutral-muted:#EEF1F8;--color-accent-fg:#0D32B2;--color-accent-emphasis:#0D32B2;--color-attention-subtle:#676C7E;--color-danger-fg:red;}.light-code{display: block}.dark-code{display: none}]]></style><g class="dg=="><g class="shape" ><rect x="12" y="12" width="435" height="82" stroke="#0D32B2" fill="#F7F8FE" class=" stroke-B1 fill-B6" style="stroke-width:2;" /></g><text x="229.5" y="50.5" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:16px"><tspan x="229.5" dy="0">1. validate options</tspan><tspan x="229.5" dy="18.5">(services, staged dir, peers, chain id, moniker, ssh port)</tspan></text></g><g class="dA=="><g class="shape" ><rect x="39" y="164" width="380" height="66" stroke="#0D32B2" fill="#F7F8FE" class=" stroke-B1 fill-B6" style="stroke-width:2;" /></g><text x="229" y="202.5" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:16px">2. plan Tor roles; onion needs an installed chain</text></g><g class="Yw=="><g class="shape" ><rect x="55" y="300" width="349" height="82" stroke="#0D32B2" fill="#F7F8FE" class=" stroke-B1 fill-B6" style="stroke-width:2;" /></g><text x="229.5" y="338.5" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:16px"><tspan x="229.5" dy="0">3. plan co-location</tspan><tspan x="229.5" dy="18.5">(apt-get tools, Preflight, preferences.yaml)</tspan></text></g><g class="Zg=="><g class="shape" ><rect x="63" y="452" width="333" height="66" stroke="#0D32B2" fill="#F7F8FE" class=" stroke-B1 fill-B6" style="stroke-width:2;" /></g><text x="229.5" y="490.5" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:16px">4. ufw status; sshd -T confirms --ssh-port</text></g><g class="cA=="><g class="shape" ><rect x="59" y="588" width="341" height="114" stroke="#0D32B2" fill="#F7F8FE" class=" stroke-B1 fill-B6" style="stroke-width:2;" /></g><text x="229.5" y="626.5" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:16px"><tspan x="229.5" dy="0">5. preflight chain</tspan><tspan x="229.5" dy="17.25">cosmovisor tarball SHA-256 pin,</tspan><tspan x="229.5" dy="17.25">genesis present or --init-chain,</tspan><tspan x="229.5" dy="17.25">staged oramad vs installed genesis binary</tspan></text></g><g class="YQ=="><g class="shape" ><rect x="97" y="772" width="264" height="82" stroke="#0D32B2" fill="#F7F8FE" class=" stroke-B1 fill-B6" style="stroke-width:2;" /></g><text x="229" y="810.5" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:16px"><tspan x="229" dy="0">6. Tor package (Tor roles only);</tspan><tspan x="229" dy="18.5">system accounts and groups</tspan></text></g><g class="Yg=="><g class="shape" ><rect x="76" y="924" width="307" height="82" stroke="#0D32B2" fill="#F7F8FE" class=" stroke-B1 fill-B6" style="stroke-width:2;" /></g><text x="229.5" y="962.5" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:16px"><tspan x="229.5" dy="0">7. copy staged binaries to</tspan><tspan x="229.5" dy="18.5">/usr/lib/orama-global/bin (root 0755)</tspan></text></g><g class="Y3Y="><g class="shape" ><rect x="134" y="1076" width="191" height="66" stroke="#0D32B2" fill="#F7F8FE" class=" stroke-B1 fill-B6" style="stroke-width:2;" /></g><text x="229.5" y="1114.5" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:16px">8. install cosmovisor</text></g><g class="aA=="><g class="shape" ><rect x="44" y="1212" width="370" height="82" stroke="#0D32B2" fill="#F7F8FE" class=" stroke-B1 fill-B6" style="stroke-width:2;" /></g><text x="229" y="1250.5" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:16px"><tspan x="229" dy="0">9. state root; --init-chain:</tspan><tspan x="229" dy="18.5">oramad init as orama-chain + network genesis</tspan></text></g><g class="bg=="><g class="shape" ><rect x="45" y="1364" width="368" height="66" stroke="#0D32B2" fill="#F7F8FE" class=" stroke-B1 fill-B6" style="stroke-width:2;" /></g><text x="229" y="1402.5" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:16px">10. co-located: netns files, unit, ruleset reload</text></g><g class="Zw=="><g class="shape" ><rect x="51" y="1500" width="357" height="82" stroke="#0D32B2" fill="#F7F8FE" class=" stroke-B1 fill-B6" style="stroke-width:2;" /></g><text x="229.5" y="1538.5" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:16px"><tspan x="229.5" dy="0">11. stage oramad as genesis binary</tspan><tspan x="229.5" dy="18.5">(cosmovisor/genesis/bin, current -&gt; genesis)</tspan></text></g><g class="aw=="><g class="shape" ><rect x="84" y="1652" width="290" height="66" stroke="#0D32B2" fill="#F7F8FE" class=" stroke-B1 fill-B6" style="stroke-width:2;" /></g><text x="229" y="1690.5" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:16px">12. public Kubo repo, config, token</text></g><g class="dQ=="><g class="shape" ><rect x="24" y="1788" width="410" height="66" stroke="#0D32B2" fill="#F7F8FE" class=" stroke-B1 fill-B6" style="stroke-width:2;" /></g><text x="229" y="1826.5" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:16px">13. write units; daemon-reload; enable (never start)</text></g><g class="dw=="><g class="shape" ><rect x="86" y="1924" width="286" height="66" stroke="#0D32B2" fill="#F7F8FE" class=" stroke-B1 fill-B6" style="stroke-width:2;" /></g><text x="229" y="1962.5" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:16px">14. ufw rules tagged orama-global</text></g><g class="cg=="><g class="shape" ><rect x="83" y="2060" width="292" height="82" stroke="#0D32B2" fill="#F7F8FE" class=" stroke-B1 fill-B6" style="stroke-width:2;" /></g><text x="229" y="2098.5" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:16px"><tspan x="229" dy="0">15. record role in preferences.yaml</tspan><tspan x="229" dy="18.5">(global, or both written last)</tspan></text></g><g class="KHYgLSZndDsgdClbMF0="><marker id="mk-d2-2162947269-3488378134" markerWidth="10" markerHeight="12" refX="7" refY="6" viewBox="0 0 10 12" orient="auto" markerUnits="userSpaceOnUse"> <polygon points="0,0 10,6 0,12" fill="#0D32B2" class="connection fill-B1" stroke-width="2" /> </marker><path d="M 229.5 96 L 229.5 160" stroke="#0D32B2" fill="none" class="connection stroke-B1" style="stroke-width:2;" marker-end="url(#mk-d2-2162947269-3488378134)" mask="url(#d2-2162947269)" /></g><g class="KHQgLSZndDsgYylbMF0="><path d="M 229.5 232 L 229.5 296" stroke="#0D32B2" fill="none" class="connection stroke-B1" style="stroke-width:2;" marker-end="url(#mk-d2-2162947269-3488378134)" mask="url(#d2-2162947269)" /></g><g class="KGMgLSZndDsgZilbMF0="><path d="M 229.5 384 L 229.5 448" stroke="#0D32B2" fill="none" class="connection stroke-B1" style="stroke-width:2;" marker-end="url(#mk-d2-2162947269-3488378134)" mask="url(#d2-2162947269)" /></g><g class="KGYgLSZndDsgcClbMF0="><path d="M 229.5 520 L 229.5 584" stroke="#0D32B2" fill="none" class="connection stroke-B1" style="stroke-width:2;" marker-end="url(#mk-d2-2162947269-3488378134)" mask="url(#d2-2162947269)" /></g><g class="KHAgLSZndDsgYSlbMF0="><path d="M 229.5 704 L 229.5 768" stroke="#0D32B2" fill="none" class="connection stroke-B1" style="stroke-width:2;" marker-end="url(#mk-d2-2162947269-3488378134)" mask="url(#d2-2162947269)" /></g><g class="KGEgLSZndDsgYilbMF0="><path d="M 229.5 856 L 229.5 920" stroke="#0D32B2" fill="none" class="connection stroke-B1" style="stroke-width:2;" marker-end="url(#mk-d2-2162947269-3488378134)" mask="url(#d2-2162947269)" /></g><g class="KGIgLSZndDsgY3YpWzBd"><path d="M 229.5 1008 L 229.5 1072" stroke="#0D32B2" f