n x="455" dy="18.5">configs/sni-router.yaml</tspan></text></g><g class="Ym9vdA=="><g class="shape" ><rect x="112" y="514" width="385" height="82" stroke="#0D32B2" fill="#F7F8FE" class=" stroke-B1 fill-B6" style="stroke-width:2;" /></g><text x="304.5" y="552.5" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:16px"><tspan x="304.5" dy="0">orama-node edge-serving phase:</tspan><tspan x="304.5" dy="18.5">vault, then EnsureSNIRouter, then EnsureCaddy</tspan></text></g><g class="Ymlu"><g class="shape" ><path d="M 304 758 C 302 758 301 758 299 758 L 54 713 C 51 713 51 712 54 711 L 299 666 C 302 666 306 666 308 666 L 553 711 C 556 711 556 712 553 713 L 309 758 C 307 758 306 758 304 758 Z" stroke="#0D32B2" fill="#CFD2DD" class=" stroke-B1 fill-N4" style="stroke-width:2;" /></g><text x="304" y="717.5" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:16px">orama-sni-router binary present?</text></g><g class="ZmFpbA=="><g class="shape" ><rect x="12" y="929" width="275" height="82" stroke="#0D32B2" fill="#F7F8FE" class=" stroke-B1 fill-B6" style="stroke-width:2;" /></g><text x="149.5" y="967.5" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:16px"><tspan x="149.5" dy="0">error: sni_router.enabled but</tspan><tspan x="149.5" dy="18.5">orama-sni-router binary missing</tspan></text></g><g class="c3RhcnQ="><g class="shape" ><rect x="306" y="929" width="307" height="98" stroke="#0D32B2" fill="#F7F8FE" class=" stroke-B1 fill-B6" style="stroke-width:2;" /></g><text x="459.5" y="967.5" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:16px"><tspan x="459.5" dy="0">write env file, start</tspan><tspan x="459.5" dy="17.666667">orama-namespace-sni-router@index</tspan><tspan x="459.5" dy="17.666667">(Before= caddy unit)</tspan></text></g><g class="aGVhbHRo"><g class="shape" ><rect x="321" y="1097" width="277" height="98" stroke="#0D32B2" fill="#F7F8FE" class=" stroke-B1 fill-B6" style="stroke-width:2;" /></g><text x="459.5" y="1135.5" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:16px"><tspan x="459.5" dy="0">edge health: Caddy and router</tspan><tspan x="459.5" dy="17.666667">both must be active before</tspan><tspan x="459.5" dy="17.666667">the node stays advertised in DNS</tspan></text></g><g class="b2Zm"><g class="shape" ><rect x="625" y="336" width="328" height="98" stroke="#0D32B2" fill="#F7F8FE" class=" stroke-B1 fill-B6" style="stroke-width:2;" /></g><text x="789" y="374.5" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:16px"><tspan x="789" dy="0">flag false: stop leftover units,</tspan><tspan x="789" dy="17.666667">stop router@index, Caddy reclaims :443</tspan><tspan x="789" dy="17.666667">on the next upgrade&#39;s Caddyfile</tspan></text></g><g class="KG9wIC0mZ3Q7IGNhcnJ5KVswXQ=="><marker id="mk-d2-518797888-3488378134" markerWidth="10" markerHeight="12" refX="7" refY="6" viewBox="0 0 10 12" orient="auto" markerUnits="userSpaceOnUse"> <polygon points="0,0 10,6 0,12" fill="#0D32B2" class="connection fill-B1" stroke-width="2" /> </marker><path d="M 446.665985 96 L 446.665985 170" stroke="#0D32B2" fill="none" class="connection stroke-B1" style="stroke-width:2;" marker-end="url(#mk-d2-518797888-3488378134)" mask="url(#d2-518797888)" /></g><g class="KGNhcnJ5IC0mZ3Q7IGNhZGR5KVswXQ=="><path d="M 154.498993 258 L 154.498993 348" stroke="#0D32B2" fill="none" class="connection stroke-B1" style="stroke-width:2;" marker-end="url(#mk-d2-518797888-3488378134)" mask="url(#d2-518797888)" /></g><g class="KGNhcnJ5IC0mZ3Q7IGNmZylbMF0="><path d="M 455.498993 258 L 455.498993 340" stroke="#0D32B2" fill="none" class="connection stroke-B1" style="stroke-width:2;" marker-end="url(#mk-d2-518797888-3488378134)" mask="url(#d2-518797888)" /></g><g class="KGNhZGR5IC0mZ3Q7IGJvb3QpWzBd"><path d="M 240.832993 420 L 240.832993 510" stroke="#0D32B2" fill="none" class="connection stroke-B1" style="stroke-wi