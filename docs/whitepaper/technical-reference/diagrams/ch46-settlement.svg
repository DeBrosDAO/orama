</tspan></text></g><g class="cGVy"><g class="shape" ><rect x="112" y="552" width="409" height="82" stroke="#0D32B2" fill="#F7F8FE" class=" stroke-B1 fill-B6" style="stroke-width:2;" /></g><text x="316.5" y="590.5" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:16px"><tspan x="316.5" dy="0">Per relay (listed by at least quorum reports):</tspan><tspan x="316.5" dy="18.5">registered, not jailed, same ed25519 in every report</tspan></text></g><g class="dXA="><g class="shape" ><rect x="136" y="704" width="361" height="66" stroke="#0D32B2" fill="#F7F8FE" class=" stroke-B1 fill-B6" style="stroke-width:2;" /></g><text x="316.5" y="742.5" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:16px">median uptime at least min_uptime_fraction</text></g><g class="dw=="><g class="shape" ><rect x="174" y="840" width="286" height="98" stroke="#0D32B2" fill="#F7F8FE" class=" stroke-B1 fill-B6" style="stroke-width:2;" /></g><text x="317" y="878.5" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:16px"><tspan x="317" dy="0">amount = median weight</tspan><tspan x="317" dy="17.666667">min(amount, per_relay_cap)</tspan><tspan x="317" dy="17.666667">x exit_multiplier if median Exit bit</tspan></text></g><g class="Y2FwMQ=="><g class="shape" ><rect x="195" y="1008" width="244" height="82" stroke="#0D32B2" fill="#F7F8FE" class=" stroke-B1 fill-B6" style="stroke-width:2;" /></g><text x="317" y="1046.5" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:16px"><tspan x="317" dy="0">scale each operator&#39;s claims</tspan><tspan x="317" dy="18.5">to per_operator_cap</tspan></text></g><g class="Y2FwMg=="><g class="shape" ><rect x="189" y="1160" width="256" height="82" stroke="#0D32B2" fill="#F7F8FE" class=" stroke-B1 fill-B6" style="stroke-width:2;" /></g><text x="317" y="1198.5" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:16px"><tspan x="317" dy="0">scale each /16 bucket&#39;s claims</tspan><tspan x="317" dy="18.5">to per_prefix16_cap</tspan></text></g><g class="Y2VpbA=="><g class="shape" ><rect x="190" y="1312" width="254" height="82" stroke="#0D32B2" fill="#F7F8FE" class=" stroke-B1 fill-B6" style="stroke-width:2;" /></g><text x="317" y="1350.5" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:16px"><tspan x="317" dy="0">scale all claims to the epoch&#39;s</tspan><tspan x="317" dy="18.5">relay ceiling</tspan></text></g><g class="bWludA=="><g class="shape" ><path d="M 243 1464 L 170 1498 L 243 1533 L 390 1533 L 463 1498 L 390 1464 Z" stroke="#0D32B2" fill="#DEE1EB" class=" stroke-B1 fill-N5" style="stroke-width:2;" /></g><text x="316.5" y="1504" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:16px">MintRelayReward(total)</text></g><g class="cGF5"><g class="shape" ><path d="M 233 1603 L 149 1649 L 233 1696 L 400 1696 L 484 1649 L 400 1603 Z" stroke="#0D32B2" fill="#DEE1EB" class=" stroke-B1 fill-N5" style="stroke-width:2;" /></g><text x="316.5" y="1647" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:16px"><tspan x="316.5" dy="0">per operator: 90% earnings,</tspan><tspan x="316.5" dy="18.5">5% burn, 5% archive fund</tspan></text></g><g class="KHJlcG9ydHMgLSZndDsgcSlbMF0="><marker id="mk-d2-4009447515-3488378134" markerWidth="10" markerHeight="12" refX="7" refY="6" viewBox="0 0 10 12" orient="auto" markerUnits="userSpaceOnUse"> <polygon points="0,0 10,6 0,12" fill="#0D32B2" class="connection fill-B1" stroke-width="2" /> </marker><path d="M 317 96 L 317 159" stroke="#0D32B2" fill="none" class="connection stroke-B1" style="stroke-width:2;" marker-end="url(#mk-d2-4009447515-3488378134)" mask="url(#d2-4009447515)" /></g><g class="KHEgLSZndDsgYSlbMF0="><path d="M 317 290 L 317 353" stroke="#0D32B2" fill="none" class="connection stroke-B1" style="stroke-width:2;" marker-end="url(#mk-d2-4009447515-3488378134)" mask="url(#d2-4009447515)" /></g