 982.5 564 L 1066.5 564 S 1076.5 564 1076.5 574 L 1076.5 599 S 1076.5 609 1066.5 609 L 984.5 609" stroke="#0D32B2" fill="none" class="connection stroke-B1" style="stroke-width:2;" marker-end="url(#mk-d2-3396068729-3488378134)" mask="url(#d2-3396068729)" /><text x="1077" y="592" fill="#676C7E" class="text-italic fill-N2" style="text-anchor:middle;font-size:16px">poll every 2 s, up to 12 min</text></g><g class="KGd3IC0mZ3Q7IHJxKVszXQ=="><path d="M 119.5 689 L 573.5 689" stroke="#0D32B2" fill="none" class="connection stroke-B1" style="stroke-width:2;" marker-end="url(#mk-d2-3396068729-3488378134)" mask="url(#d2-3396068729)" /><text x="347.5" y="695" fill="#676C7E" class="text-italic fill-N2" style="text-anchor:middle;font-size:16px">SELECT version FROM schema_migrations (inside the lock)</text></g><g class="KGd3IC0mZ3Q7IHJxKVs0XQ=="><path d="M 119.5 779 L 573.5 779" stroke="#0D32B2" fill="none" class="connection stroke-B1" style="stroke-width:2;" marker-end="url(#mk-d2-3396068729-3488378134)" mask="url(#d2-3396068729)" /><text x="348" y="785" fill="#676C7E" class="text-italic fill-N2" style="text-anchor:middle;font-size:16px">one transaction: statements + INSERT OR IGNORE tracker row</text></g><g class="KHJxIC0mZ3Q7IGd3KVswXQ=="><path d="M 575.5 869 L 121.5 869" stroke="#0D32B2" fill="none" class="connection stroke-B1" style="stroke-width:2;" marker-end="url(#mk-d2-3396068729-3488378134)" mask="url(#d2-3396068729)" /><text x="348" y="875" fill="#676C7E" class="text-italic fill-N2" style="text-anchor:middle;font-size:16px">committed or nothing applied</text></g><g class="KGd3IC0mZ3Q7IHJxKVs1XQ=="><path d="M 119.5 959 L 573.5 959" stroke="#0D32B2" fill="none" class="connection stroke-B1" style="stroke-width:2;" marker-end="url(#mk-d2-3396068729-3488378134)" mask="url(#d2-3396068729)" /><text x="347.5" y="965" fill="#676C7E" class="text-italic fill-N2" style="text-anchor:middle;font-size:16px">release: UPDATE where holder is still me</text></g><g class="KG90aGVyIC0mZ3Q7IH