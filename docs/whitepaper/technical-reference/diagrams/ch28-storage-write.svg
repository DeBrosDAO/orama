" class="text-bold fill-N1" style="text-anchor:middle;font-size:16px"><tspan x="634.5" dy="0">1. share.bin.tmp written, renamed to share.bin</tspan><tspan x="634.5" dy="18.5">(no fsync)</tspan></text></g><g class="dzI="><g class="shape" ><rect x="214" y="595" width="322" height="82" stroke="#0D32B2" fill="#F7F8FE" class=" stroke-B1 fill-B6" style="stroke-width:2;" /></g><text x="375" y="633.5" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:16px"><tspan x="375" dy="0">2. checksum.bin.tmp written, renamed</tspan><tspan x="375" dy="18.5">HMAC-SHA256(integrity.key, share)</tspan></text></g><g class="dzM="><g class="shape" ><rect x="12" y="765" width="337" height="98" stroke="#0D32B2" fill="#F7F8FE" class=" stroke-B1 fill-B6" style="stroke-width:2;" /></g><text x="180.5" y="803.5" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:16px"><tspan x="180.5" dy="0">3. meta.json.tmp written, renamed</tspan><tspan x="180.5" dy="17.666667">V1: version, threshold</tspan><tspan x="180.5" dy="17.666667">V2: version, created_ns, updated_ns, size</tspan></text></g><g class="ZG9uZQ=="><g class="shape" ><rect x="120" y="941" width="120" height="66" stroke="#0D32B2" fill="#F7F8FE" class=" stroke-B1 fill-B6" style="stroke-width:2;" /></g><text x="180" y="979.5" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:16px">200 stored</text></g><g class="YzE="><g class="shape" ><rect x="490" y="757" width="289" height="98" stroke="#0D32B2" fill="#F7F8FE" class=" stroke-B1 fill-B6" style="stroke-width:2;" /></g><text x="634.5" y="795.5" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:16px"><tspan x="634.5" dy="0">crash before step 1 completes:</tspan><tspan x="634.5" dy="17.666667">old share, old checksum, old meta</tspan><tspan x="634.5" dy="17.666667">retry at the same version succeeds</tspan></text></g><g class="YzI="><g class="shape" ><rect x="799" y="757" width="327" height="114" s